version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # The CodeQL action's init, autobuild and analyze sub-actions must run at
      # one version; separate PRs leave them mismatched and every one fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Python pip (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
