name: PyPI Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'PyPI target (pypi or testpypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read
  id-token: write   # Required for trusted publishing to PyPI

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist
        working-directory: python
        run: python -m build --sdist --outdir ../dist

      - name: Twine check sdist
        run: python -m twine check dist/*.tar.gz

      - name: Verify sdist installs (pure-Python fallback OK)
        run: |
          set -euo pipefail
          python -m venv /tmp/flexaidds-sdist-venv
          # shellcheck disable=SC1091
          source /tmp/flexaidds-sdist-venv/bin/activate
          python -m pip install --upgrade pip
          # Force pure-Python path so CI does not depend on a C++26 toolchain.
          FLEXAIDDS_SKIP_CORE=1 python -m pip install dist/*.tar.gz
          python -c "import flexaidds as fd; print('flexaidds', fd.__version__, 'HAS_CORE=', getattr(fd, 'HAS_CORE_BINDINGS', False))"
          python -m flexaidds --help
          python -m flexaidds --check-update || true
          # Version must be non-empty and match the static PEP 621 field in pyproject.toml
          # (do not hardcode — that drifted when we shipped 2.0.1/2.0.2).
          python -c "
import re
from pathlib import Path
import flexaidds as fd
assert fd.__version__, fd.__version__
text = Path('python/pyproject.toml').read_text(encoding='utf-8')
in_project = False
found = None
for line in text.splitlines():
    s = line.strip()
    if s.startswith('[') and s.endswith(']'):
        in_project = s == '[project]'
        continue
    if in_project and s.startswith('version') and '=' in s:
        found = s.split('=', 1)[1].strip().strip('\"\'')
        break
assert found == fd.__version__, (found, fd.__version__)
print('version_ok', fd.__version__)
"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 5

  # Guaranteed universal wheel so `pip install flexaidds` works without a
  # C++ compiler on any platform (accelerated wheels are additive).
  build-pure-wheel:
    name: Build pure-Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build pure-Python wheel
        working-directory: python
        env:
          FLEXAIDDS_SKIP_CORE: "1"
        run: python -m build --wheel --outdir ../dist

      - name: Twine check + smoke install
        run: |
          set -euo pipefail
          python -m twine check dist/*.whl
          python -m venv /tmp/flexaidds-pure-venv
          # shellcheck disable=SC1091
          source /tmp/flexaidds-pure-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import flexaidds as fd; print('flexaidds', fd.__version__, 'HAS_CORE=', getattr(fd, 'HAS_CORE_BINDINGS', False)); assert not fd.HAS_CORE_BINDINGS"
          python -m flexaidds --help
          # Confirm wheel is pure py3-none-any (no platform tag).
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          name = wheels[0].name
          assert name.endswith("py3-none-any.whl"), f"expected pure wheel, got {name}"
          print("pure wheel tag OK:", name)
          PY

      - name: Upload pure wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-pure
          path: dist/*.whl
          retention-days: 5

  # First release ships pure py3-none-any + sdist only. That is enough for
  # `pip install flexaidds` on every platform. Accelerated wheels (cibuildwheel)
  # can be re-enabled later once delocate/Eigen paths are fully green.

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-pure-wheel]
    runs-on: ubuntu-latest
    # Only publish on actual releases or when manually requested for pypi
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/flexaidds
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: List packages + trusted-publisher checklist
        run: |
          set -euo pipefail
          ls -la dist/
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("dist").glob("*"))
          assert files, "no artifacts to publish"
          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert sdists, "missing sdist"
          assert wheels, "missing wheel"
          print("\n".join(str(p) for p in files))
          PY
          cat <<'EOF'
          === Trusted publisher must match (pypi.org → Publishing) ===
          Owner:             LeBonhommePharma
          Repository:        FlexAIDdS
          Workflow filename: pypi-release.yml
          Environment name:  pypi
          =======================================================================
          Alternative: set repo secret PYPI_API_TOKEN (pypi.org API token for
          project flexaidds). When that secret is non-empty, the publish action
          uses token auth; otherwise it uses OIDC trusted publishing.
          EOF

      # password empty → OIDC trusted publishing; non-empty → API token.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.10.3
        with:
          skip-existing: true
          # Prefer trusted publishing when PYPI_API_TOKEN is unset.
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-testpypi:
    name: Publish to TestPyPI (manual or pre-release)
    needs: [build-sdist, build-pure-wheel]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flexaidds
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: List packages + trusted-publisher checklist
        run: |
          set -euo pipefail
          ls -la dist/
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("dist").glob("*"))
          assert files, "no artifacts to publish"
          # Ensure at least one sdist and one pure wheel are present.
          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert sdists, "missing sdist"
          assert wheels, "missing wheel"
          pure = [w for w in wheels if w.name.endswith("py3-none-any.whl")]
          assert pure, f"missing pure py3-none-any wheel among {[w.name for w in wheels]}"
          print("\n".join(str(p) for p in files))
          PY
          cat <<'EOF'
          === Trusted publisher must match (test.pypi.org → Publishing) ===
          If the project does not exist yet, create a *pending* publisher:
            https://test.pypi.org/manage/account/publishing/
          Values (must match OIDC claims exactly):
            PyPI Project Name:   flexaidds   (pending OK)
            Owner:               LeBonhommePharma
            Repository:          FlexAIDdS
            Workflow filename:   pypi-release.yml
            Environment name:    testpypi
          ==================================================================
          Alternative: set repo secret TEST_PYPI_API_TOKEN (TestPyPI API token).
          When that secret is non-empty, the publish action uses token auth;
          otherwise it uses OIDC trusted publishing.
          EOF

      # password empty → OIDC trusted publishing; non-empty → API token.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.10.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
