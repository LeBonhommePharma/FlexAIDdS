name: Code Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage Analysis (Linux/Clang)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 cmake ninja-build libeigen3-dev lcov

      - name: Configure CMake with coverage
        run: |
          mkdir -p build
          cd build
          CC=clang-18 CXX=clang++-18 cmake .. \
            -DBUILD_TESTING=ON \
            -DFLEXAIDS_ENABLE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -GNinja

      - name: Build
        run: |
          cd build
          ninja -j $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --test-dir . -V

      - name: Generate coverage report
        run: |
          cd build
          mkdir -p coverage

          # Capture coverage from test execution
          lcov --directory . \
               --capture \
               --output-file coverage/coverage.info \
               --exclude '*/_deps/*' \
               --exclude '*/tests/*' \
               --exclude '*/python/*' \
               --exclude '*/benchmarks/*'

          # Filter to only LIB source files
          lcov --extract coverage/coverage.info '*/LIB/*' \
               --output-file coverage/core.info

          # Generate HTML report
          genhtml coverage/core.info \
                  --output-directory coverage/html \
                  --title "FlexAIDdS Code Coverage"

      - name: Calculate coverage percentage
        run: |
          cd build/coverage
          COVERAGE=$(lcov --summary core.info 2>&1 | grep "lines" | awk '{print $4}' | sed 's/%//')
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          echo "### Code Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

          # Check if coverage meets minimum threshold
          THRESHOLD=50
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "⚠️ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = process.env.COVERAGE;

            const comment = `## 📊 Code Coverage Report

- **Core Coverage**: ${coverage}%
- **Target**: ≥50%
- **Status**: ${coverage >= 50 ? '✅ PASS' : '❌ FAIL'}

Coverage report: [View HTML Report](../../artifacts/)

*Generated by Code Coverage workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
