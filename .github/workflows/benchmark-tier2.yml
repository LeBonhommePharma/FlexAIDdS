name: Benchmark Tier 2 (Nightly Comprehensive)

# Full benchmark suite: all datasets, all metrics, bootstrap CIs, regression
# tracking, and a Markdown report committed as a commit comment.
#
# Triggers:
#   - After every merge to main (post-merge validation)
#   - Weekly cron (Sunday 02:00 UTC) for baseline drift detection
#   - Manual dispatch for on-demand full runs
#
# Self-hosted runner / HPC support:
#   Set runs-on to your self-hosted label (e.g. 'self-hosted,hpc,gpu').
#   For MPI multi-node runs, use the 'mpirun' step pattern below.
#
# Datasets: Zenodo record IDs are not registered. Push and weekly cron are
# --dry-run until they are. Do not cache an empty benchmark_data/ tree.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"   # Weekly: Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated dataset slugs (empty = all)"
        required: false
        default: ""
      n_workers:
        description: "Local worker processes per node"
        required: false
        default: "4"
      bootstrap:
        description: "Compute bootstrap CIs (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Dry run (no actual docking)"
        required: false
        default: "false"

concurrency:
  group: bench-tier2-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running comprehensive run

jobs:
  # -----------------------------------------------------------------------
  # Build FlexAID once per SHA (ccache objects only — never cache build/).
  # -----------------------------------------------------------------------
  build:
    name: Build FlexAIDdS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install build dependencies
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev libomp-dev libopenmpi-dev openmpi-bin gcc-14 g++-14 ccache
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # ccache is content-addressed (keyed on preprocessed source + flags), so a
      # changed source cannot hit a stale object. That is a different mechanism
      # from the build/ dir cache whose restore-keys prefix fallback restored a
      # stale binary — proven on Tier-1 (CF.pb_clash absent though the writer
      # emits it unconditionally). That cache is intentionally NOT used here.
      # ccache is safe alongside the clean `rm -rf build`: it only makes the
      # recompile cheaper, never skips one. A cmake/-only commit therefore
      # still runs cmake --build (acceptance for C-1).
      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: tier2-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tier2-ccache-${{ runner.os }}-

      # NO build-dir cache. Always compile from a clean build/ so a commit that
      # touches only cmake/ cannot upload a binary built from old sources.
      - name: Build FlexAIDdS (Release + AVX2 + OpenMP, clean)
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DFLEXAIDS_USE_AVX2=ON \
            -DFLEXAIDS_USE_AVX512=OFF \
            -DFLEXAIDS_USE_OPENMP=ON \
            -DFLEXAIDS_USE_MPI=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF
          cmake --build build --parallel --target FlexAID
          ccache --show-stats || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flexaid-binary-${{ github.sha }}
          path: build/FlexAID
          retention-days: 1

  # -----------------------------------------------------------------------
  # Benchmark runner
  # -----------------------------------------------------------------------
  benchmark:
    name: Tier-2 Benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6-hour cap for full comprehensive run

    env:
      RESULTS_DIR: results/tier2
      N_WORKERS: ${{ inputs.n_workers || '4' }}
      DO_BOOTSTRAP: ${{ inputs.bootstrap || 'true' }}
      # Push AND weekly cron dry-run until Zenodo dataset IDs are configured.
      # Schedule used to omit --dry-run, then exit 3 (BENCHMARK INCONCLUSIVE)
      # against empty benchmark_data/ (ZENODO_RECORDS is still a placeholder).
      DRY_RUN_FLAG: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || inputs.dry_run == 'true') && '--dry-run' || '' }}
      DATASET_FILTER: ${{ inputs.datasets || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml mpi4py

      - name: Install runtime dependencies
        run: |
          bash scripts/ci/apt_get_update.sh
          sudo apt-get install -y --no-install-recommends \
            libopenmpi-dev openmpi-bin

      - name: Download FlexAID binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flexaid-binary-${{ github.sha }}
          path: build/

      - name: Make binary executable
        run: chmod +x build/FlexAID

      - name: Build dataset filter argument
        id: dataset-args
        run: |
          if [ -n "$DATASET_FILTER" ]; then
            # Convert comma-separated to space-separated --dataset flags
            ARGS=$(echo "$DATASET_FILTER" | tr ',' ' ' | \
                   xargs -I{} echo "--dataset {}" | tr '\n' ' ')
            echo "FILTER_ARGS=--all" >> "$GITHUB_OUTPUT"
            echo "DATASET_LIST=$DATASET_FILTER" >> "$GITHUB_OUTPUT"
          else
            echo "FILTER_ARGS=--all" >> "$GITHUB_OUTPUT"
            echo "DATASET_LIST=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tier-2 comprehensive benchmark
        env:
          FLEXAIDDS_BINARY: ${{ github.workspace }}/build/FlexAID
          FLEXAIDDS_BENCHMARK_DATA: ${{ github.workspace }}/benchmark_data
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          BOOTSTRAP_FLAG=""
          if [ "$DO_BOOTSTRAP" = "true" ]; then
            BOOTSTRAP_FLAG="--bootstrap --n-bootstrap 5000"
          fi

          python -m benchmarks.run \
            ${{ steps.dataset-args.outputs.FILTER_ARGS }} \
            --tier 2 \
            --workers "$N_WORKERS" \
            --results-dir "$RESULTS_DIR" \
            --datasets-dir benchmarks/datasets \
            --report-prefix "$RESULTS_DIR/tier2_report_${{ github.sha }}" \
            --verbose \
            $BOOTSTRAP_FLAG \
            $DRY_RUN_FLAG

      - name: Upload full benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tier2-results-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}/
          retention-days: 90

      - name: Check for regressions
        id: regression-check
        if: always()
        run: |
          # Look for any per-dataset JSON with regression_flags set to true
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          results_dir = Path("${{ env.RESULTS_DIR }}")
          regressions = []
          for jf in results_dir.glob("*.json"):
              try:
                  data = json.loads(jf.read_text())
                  # Handle top-level report and per-dataset files
                  datasets = data.get("datasets", [data])
                  for ds in datasets:
                      flags = ds.get("regression_flags", {})
                      bad = [k for k, v in flags.items() if v]
                      if bad:
                          regressions.append(
                              f"{ds.get('dataset', jf.stem)}: {', '.join(bad)}"
                          )
              except Exception as e:
                  print(f"Warning: could not parse {jf}: {e}")

          if regressions:
              print("REGRESSIONS DETECTED:")
              for r in regressions:
                  print(f"  - {r}")
              sys.exit(1)
          else:
              print("No regressions detected.")
          EOF

      - name: Post Markdown report as commit comment
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(find "$RESULTS_DIR" -name "*.md" | sort -r | head -1)
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "No report found to post."
            exit 0
          fi
          export REPORT_PATH="$REPORT"
          # Truncate to 65535 chars (GitHub commit comment limit)
          python - <<'PYEOF' > /tmp/comment_body.md
          import os
          report = os.environ["REPORT_PATH"]
          run_id = os.environ["GITHUB_RUN_ID"]
          server = os.environ["GITHUB_SERVER_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          content = open(report, encoding="utf-8").read()
          if len(content) > 65000:
              content = content[:65000] + "\n\n_[truncated — download artifact for full report]_"
          header = "## Benchmark Tier 2 Report\n\n"
          footer = f"\n\n> _Run [{run_id}]({server}/{repo}/actions/runs/{run_id})_"
          print(header + content + footer, end="")
          PYEOF
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --method POST \
            --field body="$(cat /tmp/comment_body.md)" || true

      - name: Write job summary
        if: always()
        run: |
          REPORT=$(find "$RESULTS_DIR" -name "*.md" | sort -r | head -1)
          echo "## Benchmark Tier 2 Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit**: \`${{ github.sha }}\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "**Datasets**: ${{ steps.dataset-args.outputs.DATASET_LIST }}  " >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated (dry-run or all targets failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # -----------------------------------------------------------------------
  # Optional: MPI multi-node job (requires self-hosted runner with MPI)
  # -----------------------------------------------------------------------
  benchmark-mpi:
    name: Tier-2 MPI Distributed (${{ matrix.nodes }} nodes)
    needs: build
    runs-on: ubuntu-latest   # placeholder; switch to [self-hosted, hpc, mpi] when available
    if: false   # Disabled until self-hosted HPC runner is configured
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        nodes: [4, 8]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download FlexAID binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flexaid-binary-${{ github.sha }}
          path: build/

      - name: Make binary executable
        run: chmod +x build/FlexAID

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml mpi4py

      - name: Run distributed benchmark (${{ matrix.nodes }} nodes)
        env:
          FLEXAIDDS_BINARY: ${{ github.workspace }}/build/FlexAID
          FLEXAIDDS_BENCHMARK_DATA: ${{ github.workspace }}/benchmark_data
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          mpirun -n ${{ matrix.nodes }} \
            python -m benchmarks.run \
              --all \
              --tier 2 \
              --distributed \
              --nodes ${{ matrix.nodes }} \
              --results-dir results/tier2-mpi-${{ matrix.nodes }} \
              --datasets-dir benchmarks/datasets \
              --bootstrap

      - name: Upload MPI results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tier2-mpi-${{ matrix.nodes }}-${{ github.sha }}
          path: results/tier2-mpi-${{ matrix.nodes }}/
          retention-days: 30
