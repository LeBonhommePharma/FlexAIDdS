name: tsan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tsan-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install toolchain
        run: |
          bash scripts/ci/apt_get_update.sh
          # clang-18 is required for C++26 support (see CMakeLists.txt compiler gate).
          sudo apt-get install -y clang-18 ninja-build cmake libeigen3-dev libomp-dev

      - name: Configure (ThreadSanitizer)
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DFLEXAIDS_USE_OPENMP=OFF \
            -DBUILD_FLEXAIDDS_FAST=OFF \
            -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=thread'

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure --timeout 120
