name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'scripts/update_site_stats.py'
      - 'scripts/sync_apex_to_ghpages.sh'
      - 'scripts/sync_apex_to_usersite.sh'
      - '.github/workflows/update-site.yml'
  schedule:
    - cron: '0 6 * * *'    # Daily 06:00 UTC
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    # Pages source for this repo is the gh-pages branch (thebonhomme.com/FlexAIDdS/).
    # Do not attach the github-pages environment: protection rules have been
    # rejecting branch "main" before any step runs, so the live site froze.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0    # Full history for accurate commit count

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Update site stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_site_stats.py

      - name: Commit updated stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/FlexAIDdS/index.html site/assets/repo-stats.json site/FlexAIDdS/assets/repo-stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Update: site stats (auto)"
            # Do not fail the whole deploy on non-fast-forward (re-runs on old SHAs, concurrent runs, or races).
            # The next scheduled or push-triggered run will pick up the latest stats.
            git push origin HEAD:main || echo "::warning::git push for stats failed (non-fast-forward or race). Continuing with deploy."
          else
            echo "No stats changes to commit"
          fi

      - name: Publish site to gh-pages branch
        run: bash scripts/sync_apex_to_ghpages.sh

      - name: Sync full site to user-site repo (thebonhomme.com/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sync_apex_to_usersite.sh || echo "::warning::user-site sync failed (check repo permissions). gh-pages deploy still live."

  check-cmake-deps:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check FetchContent dependency versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_cmake_deps.py --create-issue
