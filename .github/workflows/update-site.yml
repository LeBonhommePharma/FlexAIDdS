name: Deploy Site

on:
  push:
    branches: [main, master]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'scripts/update_site_stats.py'
      - 'scripts/sync_apex_to_ghpages.sh'
      - 'scripts/sync_apex_to_usersite.sh'
      - '.github/workflows/update-site.yml'
  schedule:
    - cron: '0 6 * * *'    # Daily 06:00 UTC
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://thebonhomme.com/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0    # Full history for accurate commit count

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Update site stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_site_stats.py

      - name: Commit updated stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/FlexAIDdS/index.html site/assets/repo-stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Update: site stats (auto)"
            # Do not fail the whole deploy on non-fast-forward (re-runs on old SHAs, concurrent runs, or races).
            # The next scheduled or push-triggered run will pick up the latest stats.
            git push origin HEAD:master || echo "::warning::git push for stats failed (non-fast-forward or race). Continuing with deploy."
          else
            echo "No stats changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Project Pages mount is /FlexAIDdS/ — artifact root must be the product site,
          # not site/index.html (corporate homepage).
          path: ./site/FlexAIDdS

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Publish site to gh-pages branch
        run: bash scripts/sync_apex_to_ghpages.sh

      - name: Sync full site to user-site repo (thebonhomme.com/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sync_apex_to_usersite.sh || echo "::warning::user-site sync failed (check repo permissions). gh-pages deploy still live."

  check-cmake-deps:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Check FetchContent dependency versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_cmake_deps.py --create-issue
