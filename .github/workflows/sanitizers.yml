name: Sanitizers

on:
  push:
    branches: [ main ]
  pull_request:
  # No `branches:` filter, deliberately. Scoping this to `branches: [main]`
  # means a PR whose base is another branch fires no run at all, so a check
  # required by a ruleset can never be satisfied by a stacked PR -- the check
  # never arrives and the repo blocks permanently. Do not restore it.
  workflow_dispatch:

jobs:
  linux-clang-asan-ubsan:
    name: Linux clang with ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        run: |
          bash scripts/ci/apt_get_update.sh
          # clang-18 is required for C++26 support (see CMakeLists.txt compiler gate).
          # Eigen intentionally absent: cmake/FlexAIDEigen.cmake pins an exact
          # version that a distro 3.x package cannot satisfy. CMake fetches it.
          sudo apt-get install -y cmake ninja-build clang-18 libomp-dev

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_FLEXAIDDS_FAST=OFF \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build
        run: cmake --build build-sanitizers --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure
