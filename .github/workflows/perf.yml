name: Performance Regression

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Git SHA of baseline commit for comparison'
        required: false
        default: 'main'

jobs:
  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev libomp-dev gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Build with benchmarks
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DENABLE_TENCOM_BENCHMARK=ON \
            -DENABLE_VCFBATCH_BENCHMARK=ON \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF
          cmake --build build -j $(nproc)

      - name: Run benchmarks
        run: |
          cd build
          if [ -f benchmark_tencom ]; then
            ./benchmark_tencom | tee tencom_bench.txt
          fi
          if [ -f benchmark_vcfbatch ]; then
            ./benchmark_vcfbatch | tee vcfbatch_bench.txt
          fi

      - name: Fetch baseline artifact (optional)
        if: inputs.baseline_sha != ''
        continue-on-error: true
        run: |
          git fetch origin "${{ inputs.baseline_sha }}" --depth=1
          git show "${{ inputs.baseline_sha }}:results/perf_swarm/baseline_linux_cpu.json" \
            > baseline_ref.json 2>/dev/null || echo '{"benchmarks":[]}' > baseline_ref.json

      - name: Compare against baseline
        if: inputs.baseline_sha != ''
        continue-on-error: true
        run: |
          python3 scripts/compare_perf_baseline.py \
            --baseline baseline_ref.json \
            --tencom build/tencom_bench.txt \
            --vcfbatch build/vcfbatch_bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            build/*_bench.txt
            baseline_ref.json