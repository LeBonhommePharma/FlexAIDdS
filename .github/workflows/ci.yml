name: FlexAID CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure_python_results:
    name: Pure Python results tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
      - name: Run pure-Python tests (no C++ extension needed)
        env:
          PYTHONPATH: python
        run: >
          pytest -q
          python/tests/test_results_io.py
          python/tests/test_results_loader_models.py
          python/tests/test_pdb_io.py
          python/tests/test_import_fallback.py
          python/tests/test_py_statmech.py
          python/tests/test_thermodynamics_dataclass.py
          python/tests/test_models.py
          python/tests/test_models_deserialization.py
          python/tests/test_version.py
          python/tests/test_io.py
          python/tests/test_cli.py
          python/tests/test_docking.py
          python/tests/test_results.py
          python/tests/test_energy_matrix.py
          python/tests/test_train_256x256.py
          python/tests/test_tencm.py
          python/tests/test_tencom_results.py
          python/tests/test_visualization.py
          python/tests/test_dift.py

  cxx_core_build:
    name: C++ core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - name: linux-clang
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
          - name: macos-clang
            os: macos-15
            cc: clang
            cxx: clang++
            allow_failure: true
          - name: linux-gcc-avx512
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: "-DFLEXAIDS_USE_AVX512=ON -DBUILD_TESTING=OFF"
          - name: linux-gcc-mpi
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: "-DFLEXAIDS_USE_MPI=ON"
          - name: linux-gcc-asan
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: >-
              -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g'
              -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          # windows-msvc excluded: deep MSVC C++20/C++26 incompatibilities in legacy sources
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 / clang-18 are required for C++26 support (see CMakeLists.txt compiler gate).
          # libeigen3-dev: vendored copy lives in LIB/vendor/eigen but submodule fetch is
          # skipped in CI (shallow clone + broken gitlink) — system Eigen is equivalent.
          PKGS="cmake ninja-build libomp-dev gcc-14 g++-14 clang-18 libeigen3-dev"
          if [ "${{ matrix.name }}" = "linux-gcc-mpi" ]; then
            PKGS="$PKGS libopenmpi-dev openmpi-bin"
          fi
          sudo apt-get install -y $PKGS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Apple Clang ≥ 16 (Xcode 16) is required for C++26.
          # Eigen3: system install via brew; vendored submodule skipped in CI.
          sudo xcode-select -s /Applications/Xcode_16.app || true
          brew install cmake ninja libomp eigen
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ninja eigen -y
        shell: cmd
      - name: Configure
        shell: bash
        run: |
          export CC=${{ matrix.cc }}
          export CXX=${{ matrix.cxx }}
          CMAKE_ARGS=(
            -S . -B build -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DFLEXAIDS_USE_CUDA=OFF
            -DFLEXAIDS_USE_METAL=OFF
            -DBUILD_PYTHON_BINDINGS=OFF
            -DBUILD_TESTING=ON
            -DFLEXAIDS_STRICT_SOURCE_VALIDATION=ON
            ${{ matrix.cmake_extra }}
          )
          # Homebrew on Apple Silicon installs to /opt/homebrew
          if [ "$RUNNER_OS" = "macOS" ]; then
            CMAKE_ARGS+=(-DCMAKE_PREFIX_PATH="$(brew --prefix)")
            CMAKE_ARGS+=(-DBUILD_TESTING=OFF)
            CMAKE_ARGS+=(-DOpenMP_ROOT="$(brew --prefix libomp)")
          fi
          cmake "${CMAKE_ARGS[@]}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: matrix.name == 'linux-gcc' || matrix.name == 'linux-clang' || matrix.name == 'linux-gcc-mpi' || matrix.name == 'linux-gcc-asan'
        run: ctest --test-dir build --output-on-failure

  python_bindings_smoke:
    name: Python bindings smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
            allow_failure: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          # libeigen3-dev: system Eigen used in CI (submodule fetch skipped, see cxx_core_build).
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 libeigen3-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install 'pybind11[global]' pytest numpy
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install ninja eigen -y
          python -m pip install --upgrade pip
          python -m pip install "pybind11[global]" pytest numpy
      - name: Configure Python bindings (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-python -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DPYBIND11_FINDPYTHON=ON \
            -DFLEXAIDS_USE_OPENMP=OFF \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${{ github.workspace }}/python/flexaidds
      - name: Configure Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-python -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DBUILD_PYTHON_BINDINGS=ON ^
            -DPYBIND11_FINDPYTHON=ON ^
            -DFLEXAIDS_USE_OPENMP=OFF ^
            -DFLEXAIDS_USE_CUDA=OFF ^
            -DFLEXAIDS_USE_METAL=OFF ^
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${{ github.workspace }}\python\flexaidds
      - name: Build Python extension (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build-python --parallel --target _core
      - name: Build Python extension (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-python --parallel --target _core
      - name: Run Python binding tests
        env:
          PYTHONPATH: python
        run: |
          python -m pip install scipy
          pytest -q python/tests/test_statmech_smoke.py python/tests/test_statmech.py python/tests/test_thermodynamics.py python/tests/test_encom.py python/tests/test_energy_matrix.py python/tests/test_train_256x256.py

  repo_hygiene:
    name: Repository hygiene (env + agent paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Install skill test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy
      - name: Check tracked secrets and hardcoded agent paths
        run: python3 scripts/check_repo_hygiene.py
      - name: Validate flexaidds skill packaging
        env:
          FLEXAIDDS_REQUIRE_BUILD: '0'
        run: python3 .grok/skills/flexaidds/scripts/validate_skill.py
      - name: Skill unit tests (figure handler + resolve_build + edge cases)
        env:
          FLEXAIDDS_REQUIRE_BUILD: '0'
          PYTHONPATH: ${{ github.workspace }}/python
        run: python3 -m pytest tests/test_flexaid_skill.py tests/test_flexaidds_skill_figure.py tests/test_resolve_build.py tests/test_skill_edge_cases.py -q --tb=line

  # New job: Validates the flexaidds skill's DatasetRunner features
  # (per-entry checkpointing, --resume + CostHistory, --package reproducibility)
  flexaid_docking_datasetrunner:
    name: flexaidds skill (DatasetRunner --resume --package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install skill dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml numpy

      - name: Run tiny DatasetRunner validation with new features
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python3 .grok/skills/flexaidds/scripts/dataset_runner.py \
            --dataset astex_diverse \
            --tier 1 \
            --dry-run \
            --resume \
            --package \
            --results-dir results/ci_datasetrunner_test

      - name: Verify reproducibility package and per-entry artifacts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          echo "=== Validation package contents ==="
          # The skill script places the package in results/ (parent of --results-dir)
          PKG=$(find results/ -maxdepth 1 -name "flexaidds_validation_package_*.zip" | head -1)
          if [ -z "$PKG" ]; then
            echo "No validation package found under results/!"
            find results/ -name "*.zip" 2>/dev/null || true
            exit 1
          fi
          ls -la "$PKG"

          echo "=== Checking for per-entry manifest (new feature) ==="
          unzip -l "$PKG" | grep -E '(_entry_manifest|VALIDATION_SUMMARY|REPRODUCIBILITY)' || echo "Warning: expected per-entry files not found in package"

          echo "=== Checking generated reports ==="
          find results/ -name "_entry_manifest.json" -o -name "report_*.md" 2>/dev/null | head -10 || echo "No per-entry artifacts found"

          echo "DatasetRunner --resume --package validation: SUCCESS"
