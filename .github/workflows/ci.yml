name: FlexAID CI

on:
  # push is restricted to main: an unrestricted `push:` made every commit on a
  # PR branch run this whole matrix TWICE (once per event) on the same SHA.
  # The concurrency group below cannot dedupe those two, because github.ref is
  # refs/heads/<branch> on push and refs/pull/<n>/merge on pull_request -- two
  # different groups by construction. Every other workflow in this repo that
  # has both triggers already scopes push to main; this one and license-scan
  # were the exceptions. See #338.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref (the source branch, set only on pull_request) before ref, so a PR
  # and any future push-triggered run for the same branch share one group.
  # Defence in depth: the branches filter above is what actually removes the
  # duplicate; this stops it recurring if push is ever widened again.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pure_python_results:
    name: Pure Python results tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
      - name: Run pure-Python tests (no C++ extension needed)
        env:
          PYTHONPATH: python
        run: >
          pytest -q
          python/tests/test_results_io.py
          python/tests/test_results_loader_models.py
          python/tests/test_pdb_io.py
          python/tests/test_import_fallback.py
          python/tests/test_py_statmech.py
          python/tests/test_thermodynamics_dataclass.py
          python/tests/test_models.py
          python/tests/test_models_deserialization.py
          python/tests/test_version.py
          python/tests/test_io.py
          python/tests/test_cli.py
          python/tests/test_docking.py
          python/tests/test_results.py
          python/tests/test_energy_matrix.py
          python/tests/test_train_256x256.py
          python/tests/test_tencm.py
          python/tests/test_tencom_results.py
          python/tests/test_visualization.py
          python/tests/test_dift.py
          benchmarks/tests/test_itc_calibration.py

  # Linux C++ matrix only. macOS CPU build+ctest is the dedicated blocking job
  # macos_cpu_tests (no continue-on-error). See docs/CI_RELEASE_GATES.md.
  cxx_core_build:
    name: C++ core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - name: linux-clang
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
          - name: linux-gcc-avx512
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: "-DFLEXAIDS_USE_AVX512=ON -DBUILD_TESTING=OFF"
            allow_failure: true
          - name: linux-gcc-mpi
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: "-DFLEXAIDS_USE_MPI=ON"
          - name: linux-gcc-asan
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            cmake_extra: >-
              -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g'
              -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          # windows-msvc excluded: deep MSVC C++20/C++26 incompatibilities in legacy sources
          # macos-clang removed from soft-fail matrix → see macos_cpu_tests (blocking)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 / clang-18 are required for C++26 support (see CMakeLists.txt compiler gate).
          # libeigen3-dev: vendored copy lives in LIB/vendor/eigen but submodule fetch is
          # skipped in CI (shallow clone + broken gitlink) — system Eigen is equivalent.
          PKGS="cmake ninja-build libomp-dev gcc-14 g++-14 clang-18 libeigen3-dev"
          if [ "${{ matrix.name }}" = "linux-gcc-mpi" ]; then
            PKGS="$PKGS libopenmpi-dev openmpi-bin"
          fi
          sudo apt-get install -y $PKGS
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ninja eigen -y
        shell: cmd
      - name: Configure
        shell: bash
        run: |
          export CC=${{ matrix.cc }}
          export CXX=${{ matrix.cxx }}
          CMAKE_ARGS=(
            -S . -B build -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DFLEXAIDS_USE_CUDA=OFF
            -DFLEXAIDS_USE_METAL=OFF
            -DBUILD_PYTHON_BINDINGS=OFF
            -DBUILD_TESTING=ON
            -DFLEXAIDS_STRICT_SOURCE_VALIDATION=ON
            ${{ matrix.cmake_extra }}
          )
          cmake "${CMAKE_ARGS[@]}"
      - name: Build
        run: cmake --build build --parallel
      # Smoke: assert the shipping binary starts. Until this step existed, no
      # job in this workflow ran FlexAID at all — only unit tests linked
      # against LIB/. Tier-1 (benchmark-tier1.yml) did run it, but treated a
      # non-zero exit as a logger.warning and reported a pass anyway, so a
      # binary that aborted on all five entries and produced zero poses still
      # went green in 0.4s. Nothing anywhere failed on "the binary did not
      # run."
      #
      # That is how a startup abort lived in main under a green matrix: the
      # 255-byte realpath() destination at LIB/top.cpp tripped glibc
      # _FORTIFY_SOURCE (__realpath_chk fails when the destination is smaller
      # than PATH_MAX, before resolving anything), so every fortified gcc build
      # died before parsing argv. --help is the cheapest invocation that proves
      # the binary starts, so this is deliberately a liveness gate and not a
      # behaviour test.
      #
      # Scope: this catches a binary that cannot start. It does NOT catch a
      # binary that starts and then silently produces nothing — that is the
      # benchmark's own gate to fix, not this one's.
      #
      # detect_leaks=0 on purpose: this asserts the binary starts, not that it
      # frees. Error-path leaks are a separate concern with its own probe, and
      # letting LSan fail this step would conflate "dead on arrival" with
      # "exits dirty".
      - name: Smoke — shipping binary starts (--help)
        if: matrix.name == 'linux-gcc' || matrix.name == 'linux-clang' || matrix.name == 'linux-gcc-mpi' || matrix.name == 'linux-gcc-asan'
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          test -x build/FlexAID || { echo "::error::build/FlexAID missing or not executable"; exit 1; }
          build/FlexAID --help > help.out 2> help.err || {
            echo "::error::FlexAID --help exited $? — the shipping binary does not start"
            echo "--- stdout ---"; cat help.out
            echo "--- stderr ---"; cat help.err
            exit 1
          }
          grep -q "Usage:" help.out || {
            echo "::error::FlexAID --help exited 0 but printed no usage text"
            echo "--- stdout ---"; cat help.out
            echo "--- stderr ---"; cat help.err
            exit 1
          }
          echo "FlexAID --help: exit 0, usage text present"
      - name: Test
        if: matrix.name == 'linux-gcc' || matrix.name == 'linux-clang' || matrix.name == 'linux-gcc-mpi' || matrix.name == 'linux-gcc-asan'
        run: ctest --test-dir build --output-on-failure

  # Blocking macOS CPU gate (audit: was allow_failure + BUILD_TESTING=OFF).
  # No continue-on-error. Metal is intentionally OFF here; shader smoke and
  # self-hosted full Metal gate are separate (docs/CI_RELEASE_GATES.md).
  macos_cpu_tests:
    name: macOS CPU tests (blocking)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: false
      - name: Install macOS dependencies
        run: |
          # Apple Clang ≥ 16 (Xcode 16) is required for C++26.
          # Eigen3: system install via brew; vendored submodule skipped in CI.
          sudo xcode-select -s /Applications/Xcode_16.app || true
          brew install cmake ninja libomp eigen
      - name: Configure (CPU, tests ON, Metal OFF)
        run: |
          CMAKE_ARGS=(
            -S . -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DFLEXAIDS_USE_CUDA=OFF
            -DFLEXAIDS_USE_METAL=OFF
            -DBUILD_PYTHON_BINDINGS=OFF
            -DBUILD_TESTING=ON
            -DFLEXAIDS_STRICT_SOURCE_VALIDATION=ON
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
            -DOpenMP_ROOT="$(brew --prefix libomp)"
          )
          cmake "${CMAKE_ARGS[@]}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test (ctest blocking)
        run: ctest --test-dir build --output-on-failure --timeout 120

  # Hosted Metal compile smoke: .metal → .air only (no full OBJCXX link).
  # Exit 2 from the script = toolchain missing → soft-skip with notice.
  # Full Metal link/runtime: workflow_dispatch metal-self-hosted.yml (self-hosted-m3).
  macos_metal_compile_smoke:
    name: Metal shader compile smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: false
      - name: Prefer recent Xcode (Metal toolchain)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version || true
          xcrun -f metal || true
      - name: Compile Metal shaders (smoke)
        id: metal_smoke
        run: |
          set +e
          bash scripts/ci/metal_compile_smoke.sh "${{ github.workspace }}/build-metal-smoke"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice title=Metal toolchain absent::Hosted runner has no metal compiler; full Metal release gate is metal-self-hosted.yml (label self-hosted-m3). See docs/CI_RELEASE_GATES.md"
            exit 0
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Record smoke outcome
        run: echo "Metal smoke status=${{ steps.metal_smoke.outputs.status }}"

  python_bindings_smoke:
    name: Python bindings smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
            allow_failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          # libeigen3-dev: system Eigen used in CI (submodule fetch skipped, see cxx_core_build).
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 libeigen3-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install 'pybind11[global]' pytest numpy
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install ninja eigen -y
          python -m pip install --upgrade pip
          python -m pip install "pybind11[global]" pytest numpy
      # Sets up the MSVC toolchain (cl, link, headers) once and exports it to
      # PATH for all subsequent steps in this job. Replaces the per-step
      # hardcoded vcvars64.bat calls, whose Enterprise-edition path no longer
      # resolves on the windows-latest image (cl was never on PATH -> build
      # failed with "cl is not a full path and was not found in the PATH").
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure Python bindings (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-python -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DPYBIND11_FINDPYTHON=ON \
            -DFLEXAIDS_USE_OPENMP=OFF \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${{ github.workspace }}/python/flexaidds
      - name: Configure Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -S . -B build-python -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DBUILD_PYTHON_BINDINGS=ON ^
            -DPYBIND11_FINDPYTHON=ON ^
            -DFLEXAIDS_USE_OPENMP=OFF ^
            -DFLEXAIDS_USE_CUDA=OFF ^
            -DFLEXAIDS_USE_METAL=OFF ^
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${{ github.workspace }}\python\flexaidds
      - name: Build Python extension (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build-python --parallel --target _core
      - name: Build Python extension (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build build-python --parallel --target _core
      - name: Run Python binding tests
        env:
          PYTHONPATH: python
        run: |
          python -m pip install scipy
          pytest -q python/tests/test_statmech_smoke.py python/tests/test_statmech.py python/tests/test_thermodynamics.py python/tests/test_encom.py python/tests/test_energy_matrix.py python/tests/test_train_256x256.py

  repo_hygiene:
    name: Repository hygiene (env + agent paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install skill test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy
      - name: Check tracked secrets and hardcoded agent paths
        run: python3 scripts/check_repo_hygiene.py
      - name: Validate flexaidds skill packaging
        env:
          FLEXAIDDS_REQUIRE_BUILD: '0'
        run: python3 .grok/skills/flexaidds/scripts/validate_skill.py
      - name: Skill unit tests (figure handler + resolve_build + edge cases)
        env:
          FLEXAIDDS_REQUIRE_BUILD: '0'
          PYTHONPATH: ${{ github.workspace }}/python
        run: python3 -m pytest tests/test_flexaid_skill.py tests/test_flexaidds_skill_figure.py tests/test_resolve_build.py tests/test_skill_edge_cases.py tests/test_aggregate_claim_metrics.py -q --tb=line

  # New job: Validates the flexaidds skill's DatasetRunner features
  # (per-entry checkpointing, --resume + CostHistory, --package reproducibility)
  flexaid_docking_datasetrunner:
    name: flexaidds skill (DatasetRunner --resume --package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install skill dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml numpy

      - name: Run tiny DatasetRunner validation with new features
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python3 .grok/skills/flexaidds/scripts/dataset_runner.py \
            --dataset astex_diverse \
            --tier 1 \
            --dry-run \
            --resume \
            --package \
            --results-dir results/ci_datasetrunner_test

      - name: Verify reproducibility package and per-entry artifacts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          echo "=== Validation package contents ==="
          # The skill script places the package in results/ (parent of --results-dir)
          PKG=$(find results/ -maxdepth 1 -name "flexaidds_validation_package_*.zip" | head -1)
          if [ -z "$PKG" ]; then
            echo "No validation package found under results/!"
            find results/ -name "*.zip" 2>/dev/null || true
            exit 1
          fi
          ls -la "$PKG"

          echo "=== Checking for per-entry manifest (new feature) ==="
          unzip -l "$PKG" | grep -E '(_entry_manifest|VALIDATION_SUMMARY|REPRODUCIBILITY)' || echo "Warning: expected per-entry files not found in package"

          echo "=== Checking generated reports ==="
          find results/ -name "_entry_manifest.json" -o -name "report_*.md" 2>/dev/null | head -10 || echo "No per-entry artifacts found"

          echo "DatasetRunner --resume --package validation: SUCCESS"
