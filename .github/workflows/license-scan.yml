name: License Compliance

on:
  # Restricted to main for the same reason as ci.yml: an unrestricted `push:`
  # alongside `pull_request:` runs this twice per commit on a PR branch. See #338.
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: License scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'

      - name: Install scancode-toolkit
        run: pip install scancode-toolkit

      - name: Run license scan
        run: |
          scancode --license --package --info \
            --json-pp license-report.json \
            --timeout 120 \
            --processes 2 \
            LIB/ python/ tests/ \
            || true

      - name: Check for forbidden licenses
        run: python scripts/check_licenses.py license-report.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-report
          path: license-report.json
