name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write so a successful SDK run can post the review comment.
      # Do not set track_progress / extra claude_args here: on this repo that
      # combination aborted the SDK in ~350ms with is_error:true and $0 cost
      # (run 32091914831). The working reviews use the plugin prompt only.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Step-level continue-on-error (not job-level): a failed step with this
      # flag still lets the job conclude success, so the PR check is green.
      # Job-level continue-on-error leaves the check red while only the
      # workflow overall succeeds.
      - name: Run Claude Code Review
        id: claude-review
        # Not a required check. The Anthropic plugin often returns
        # subtype=success / is_error=true with num_turns=1 and $0 cost
        # (OAuth/plugin abort; anthropics/claude-code-action#1614).
        # Hygiene and Tier-1 are the merge gates.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Cursor cloud/background agents open PRs as cursor[bot]. The action
          # rejects Bot actors unless listed here. Do NOT use '*' — on a public
          # repo that would let arbitrary GitHub Apps invoke the reviewer with a
          # prompt they control. See anthropics/claude-code-action docs/security.md.
          allowed_bots: cursor,cursor[bot]

      - name: Note Claude reviewer outage
        if: steps.claude-review.outcome == 'failure'
        run: |
          echo "::warning::Claude Code Review SDK returned is_error:true with zero cost (auth/quota). This is not a review of the PR diff. Refresh CLAUDE_CODE_OAUTH_TOKEN or wait for the Anthropic cap to reset."
