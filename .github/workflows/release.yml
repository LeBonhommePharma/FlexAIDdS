name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'LIB/**'
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build release artifacts (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            artifact_name: flexaidds-linux
          - name: macos-clang
            os: macos-15
            cc: clang
            cxx: clang++
            artifact_name: flexaidds-macos
          # The full engine requires Clang >=18 or GCC >=14. MSVC's C++20
          # compatibility path is reserved for the Python extension smoke job.
          - name: windows-clang
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            artifact_name: flexaidds-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          sudo apt-get install -y cmake ninja-build libeigen3-dev libomp-dev gcc-14 g++-14

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Apple Clang ≥ 16 (Xcode 16) is required for C++26.
          sudo xcode-select -s /Applications/Xcode_16.app || true
          brew install cmake ninja libomp eigen

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ninja eigen -y
        shell: cmd

      - name: Set up Windows SDK and linker environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          export CC=${{ matrix.cc }}
          export CXX=${{ matrix.cxx }}
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TESTING=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          clang-cl --version
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DFLEXAIDS_USE_OPENMP=OFF ^
            -DFLEXAIDS_USE_CUDA=OFF ^
            -DFLEXAIDS_USE_METAL=OFF ^
            -DBUILD_PYTHON_BINDINGS=OFF ^
            -DBUILD_TESTING=ON

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel 2

      - name: Build shipping executables and portability tests (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake --build build --parallel 2 --target
          FlexAID FlexAIDdS tENCoM test_mol2_sdf_reader test_flexaidds_flags

      - name: Verify reader and environment behavior (Windows)
        if: runner.os == 'Windows'
        run: >
          ctest --test-dir build --output-on-failure --parallel 1
          --no-tests=error -R "^(Mol2SdfReaderTests|FlexaiddsFlagsTests)$"

      - name: Smoke test shipping executables (Unix)
        if: runner.os != 'Windows'
        run: |
          build/FlexAID --help > help.out
          grep -q 'Usage:' help.out
          build/FlexAIDdS --version

      - name: Smoke test shipping executables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build\FlexAID.exe --help > help.out || exit /b 1
          findstr /C:"Usage:" help.out || exit /b 1
          build\FlexAIDdS.exe --version || exit /b 1

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp -f build/FlexAID build/FlexAIDdS build/tENCoM LICENSE dist/
          tar -czf ${{ matrix.artifact_name }}.tar.gz dist

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\FlexAID.exe, build\FlexAIDdS.exe, build\tENCoM.exe, LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact_name }}.zip -Force

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
