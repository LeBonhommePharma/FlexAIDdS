name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze C++ and Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e # v4
        with:
          languages: ${{ matrix.language }}

      - name: Install C++ dependencies
        if: matrix.language == 'cpp'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          sudo apt-get install -y cmake ninja-build libeigen3-dev libboost-all-dev gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Build C++
        if: matrix.language == 'cpp'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TENCOM_TOOL=OFF \
            -DENABLE_TENCOM_BENCHMARK=OFF \
            -DENABLE_VCFBATCH_BENCHMARK=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF
          cmake --build build --parallel --target FlexAID

      - name: Autobuild
        if: matrix.language != 'cpp'
        uses: github/codeql-action/autobuild@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e # v4
