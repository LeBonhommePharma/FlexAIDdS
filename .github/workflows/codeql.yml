name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
  # No `branches:` filter, deliberately. Scoping this to `branches: [main]`
  # means a PR whose base is another branch fires no run at all, so a check
  # required by a ruleset can never be satisfied by a stacked PR -- the check
  # never arrives and the repo blocks permanently. Do not restore it.
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze C++ and Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Install C++ dependencies
        if: matrix.language == 'cpp'
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          # Eigen intentionally absent: cmake/FlexAIDEigen.cmake pins an exact
          # version that a distro 3.x package cannot satisfy. CMake fetches it.
          sudo apt-get install -y cmake ninja-build libboost-all-dev gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Build C++
        if: matrix.language == 'cpp'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TENCOM_TOOL=OFF \
            -DENABLE_TENCOM_BENCHMARK=OFF \
            -DENABLE_VCFBATCH_BENCHMARK=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF
          cmake --build build --parallel --target FlexAID

      - name: Autobuild
        if: matrix.language != 'cpp'
        uses: github/codeql-action/autobuild@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
