name: Benchmark Tier 1 (PR Sanity)

# Lightweight benchmark gate on every PR to main.
# Runs 5 Astex Diverse targets.
# Posts results as a PR comment via a workflow summary + comment action.
#
# Timeout budget: the original 10-minute job cap was set when every FlexAID
# invocation aborted instantly (fortified-glibc realpath overflow, fixed in
# #323) and a whole "run" cost 0.4s. With a binary that actually docks, 5
# targets did not finish in the ~7 minutes left after a cache-miss rebuild.
# The job cap now covers build + benchmark with headroom, and the benchmark
# step has its own cap so a genuine hang still fails fast instead of eating
# the whole job budget.
#
# Failures: non-zero exit (metric regression) sets the check to "failure"
# so merges can be gated on this job.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset slug to benchmark"
        required: false
        default: "astex_diverse"
      tier1_subset_size:
        description: "Number of targets (overrides YAML default)"
        required: false
        default: "5"
      com_floor:
        description: "FLEXAIDDS_COM_FLOOR F (soft floor on CF.com; empty/0 = off, unchanged)"
        required: false
        default: ""
      pb_pocket_w:
        description: "FLEXAIDDS_PB_POCKET_WEIGHT (P1 pocket steer; empty/0 = off)"
        required: false
        default: ""
      pb_clash_w:
        description: "FLEXAIDDS_PB_CLASH_WEIGHT (P1 clash steer; empty/0 = off)"
        required: false
        default: ""
      seed:
        description: "FLEXAID_SEED (single-D; fixed GA seed for determinism). Empty = time(0)."
        required: false
        default: ""
      tag:
        description: "Free label to distinguish otherwise-identical cells (e.g. the G3' determinism repeat). Does not reach the engine."
        required: false
        default: ""

concurrency:
  # Include the sweep inputs + tag so distinct cells run in parallel instead of
  # cancelling each other; a re-dispatch of the SAME cell still supersedes its
  # stale run. `tag` lets two identical-env cells (the G3' repeat) coexist.
  group: bench-tier1-${{ github.workflow }}-${{ github.ref }}-${{ inputs.com_floor }}-${{ inputs.pb_pocket_w }}-${{ inputs.pb_clash_w }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  tier1-benchmark:
    name: Tier-1 Benchmark (${{ inputs.dataset || 'astex_diverse' }})
    runs-on: ubuntu-latest
    # Clean build (~20 min, no cache) + 2 targets docking + overhead. Switch-on cells
    # (COM floor / P1) run ~2-3x slower; 1mq6 (flexible, 10 rotatable bonds) is the long pole.
    timeout-minutes: 130
    permissions:
      contents: read
      pull-requests: write   # required by marocchino/sticky-pull-request-comment

    env:
      DATASET: ${{ inputs.dataset || 'astex_diverse' }}
      RESULTS_DIR: results/tier1
      # Keep the engine's pose PDBs. Without this the runner deletes them with
      # the per-ligand temp dir it docks in (runner.py _run_flexaid), so the
      # upload step below has only ever collected JSON: every question that
      # needs coordinates rather than scalars was unanswerable from CI, and no
      # change to the `path:` list could have fixed it. The copy destination is
      # under RESULTS_DIR by construction (DatasetRunner.pose_pdb_dir), which
      # is what makes the existing upload reach them.
      FLEXAIDDS_KEEP_POSES: "1"
      # NOTE: this MUST stay an absolute path. The "Verify binary exists" step
      # below now hard-fails when the binary is absent (no more dry-run
      # fallback), and it tests this exact string with `-x` from the repo root
      # while FlexAID runs from a per-entry tmp dir. An absolute path means the
      # guard and the subprocess resolve to the same file; making this
      # overridable with a relative/bare value would reintroduce the CWD-mismatch
      # class and could turn a PATH-resolvable binary into a hard failure.
      FLEXAIDDS_BINARY: ${{ github.workspace }}/build/FlexAID
      # Astex Diverse data lives in the repo under benchmarks/astex_diverse/.
      # Setting FLEXAIDDS_BENCHMARK_DATA makes the runner look at
      # benchmarks/astex_diverse/astex_diverse/<TARGET>/ for receptor + ligand files.
      FLEXAIDDS_BENCHMARK_DATA: ${{ github.workspace }}/benchmarks/astex_diverse

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml

      - name: Install Linux build dependencies
        run: |
          bash scripts/ci/apt_get_update.sh
          # gcc-14 is required for C++26 support (see CMakeLists.txt compiler gate).
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev libomp-dev gcc-14 g++-14 ccache time
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # Report the machine we actually got — decides the --workers/--omp-threads
      # split below; nproc here had never been recorded.
      - name: Report runner capacity
        run: |
          NPROC=$(nproc)
          echo "nproc=$NPROC"
          echo "NPROC=$NPROC" >> "$GITHUB_ENV"
          grep -m1 'model name' /proc/cpuinfo || true

      # ccache is content-addressed (keyed on preprocessed source + flags), so a
      # changed source cannot hit a stale object. That is a different mechanism
      # from the build/ dir cache whose restore-keys prefix fallback restored a
      # stale binary this run — that cache is intentionally NOT reintroduced.
      # ccache is safe alongside the clean `rm -rf build`: it only makes the
      # recompile cheaper, never skips one.
      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: tier1-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tier1-ccache-${{ runner.os }}-

      # NO build-dir cache. The restore-keys prefix fallback restored a stale
      # build/ and incremental cmake --build did not recompile changed sources —
      # proven this run (CF.pb_clash absent though the writer emits it
      # unconditionally). A correctness experiment compiles from clean.
      - name: Build FlexAIDdS (fast profile, clean)
        run: |
          rm -rf build
          # AVX-512 pinned OFF. Deriving it from /proc/cpuinfo makes the same
          # commit compile differently per runner, silently reintroducing the
          # variable the seed + single-thread + no-restart determinism setup
          # exists to remove. AVX2 only.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFLEXAIDS_USE_CUDA=OFF \
            -DFLEXAIDS_USE_METAL=OFF \
            -DFLEXAIDS_USE_AVX2=ON \
            -DFLEXAIDS_USE_AVX512=OFF \
            -DFLEXAIDS_USE_OPENMP=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF
          cmake --build build --parallel --target FlexAID
          ccache --show-stats || true

      - name: Verify binary exists
        run: |
          # A Tier-1 benchmark exists to exercise the real engine. If the build
          # did not produce a binary, FAIL loudly — do NOT fall back to
          # --dry-run. The old fallback composed into an inverted gate: a
          # missing binary set --dry-run, and the #327 completeness/liveness
          # gate skips on dry-run (cli.py: `if not runner.dry_run`), so a run
          # with no engine exited 0 GREEN — the exact fake-green that gate
          # exists to prevent, and the shape that produced the 0.5s greens
          # before #323. Tier-2 has never had this fallback and is honest by
          # its absence; this makes Tier-1 match it.
          # -x, not -f: a present-but-non-executable binary must also fail here,
          # with this clear message, rather than at the opaque exec later.
          if [ ! -x "$FLEXAIDDS_BINARY" ]; then
            echo "::error::FlexAID binary not found or not executable at $FLEXAIDDS_BINARY — the build did not produce a runnable binary. Failing rather than silently dry-running (a dry-run would skip the #327 gate and report a missing engine as a pass)."
            exit 1
          fi

      # No dataset download step needed: Astex Diverse data lives in the repo
      # under benchmarks/astex_diverse/astex_diverse/<UPPERCASE_ID>/.
      # FLEXAIDDS_BENCHMARK_DATA env var above points the runner there.

      - name: Run tier-1 benchmark
        # Measured: switches-off 2 targets ~44 min; switch-on cells time out at 45.
        # 1mq6 (flexible) is the long pole under COM floor / P1. Give generous headroom.
        timeout-minutes: 105
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          # Scoring switches forwarded from workflow_dispatch inputs. All read at
          # RUNTIME via std::getenv (vcfunction.cpp:948, top.cpp:534/543), so no
          # rebuild is needed. Empty string => COM_FLOOR F<=0 skipped, weights
          # atof("")=0 off => the engine is bit-identical to a run with these unset.
          FLEXAIDDS_COM_FLOOR: ${{ inputs.com_floor }}
          FLEXAIDDS_PB_POCKET_WEIGHT: ${{ inputs.pb_pocket_w }}
          FLEXAIDDS_PB_CLASH_WEIGHT: ${{ inputs.pb_clash_w }}
          # Determinism (ops/launch_comfloor.sh). A fixed seed + single-thread +
          # no parallel restarts/elitism makes every cell a matched comparison and
          # makes G3' (a repeat is bit-identical) testable. FLEXAID_SEED is single-D
          # (RngSeed.h:28); empty => time(0) fallback (gaboom.cpp:337).
          FLEXAID_SEED: ${{ inputs.seed }}
          OMP_NUM_THREADS: "1"
          FLEXAIDDS_PARALLEL_RESTARTS: "0"
          FLEXAIDDS_SEED_ELITISM: "0"
        run: |
          # Provenance sidecar: record exactly which switches this run used, next
          # to the artifacts it produced. The run manifest records omp_threads but
          # nothing about scoring config; without this, N sweep artifacts are
          # indistinguishable except by run id. Uploaded with the results below.
          mkdir -p "$RESULTS_DIR"
          cat > "$RESULTS_DIR/_sweep_config.json" <<JSON
          {
            "git_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "com_floor": "${{ inputs.com_floor }}",
            "pb_pocket_weight": "${{ inputs.pb_pocket_w }}",
            "pb_clash_weight": "${{ inputs.pb_clash_w }}",
            "flexaid_seed": "${{ inputs.seed }}",
            "omp_num_threads": "1",
            "parallel_restarts": "0",
            "seed_elitism": "0",
            "tier1_subset_size_input": "${{ inputs.tier1_subset_size }}",
            "dataset": "${{ env.DATASET }}"
          }
          JSON
          # Target-level parallelism. The runner previously used the CLI
          # defaults --workers 1 / --omp-threads 4: five targets docked
          # strictly one after another, while each one asked for four OpenMP
          # threads. On a 2-core runner that is simultaneously serial across
          # targets AND oversubscribed within one — the one combination nobody
          # would pick deliberately.
          #
          # Derive both from the machine instead of hardcoding either, since
          # nproc here had never actually been recorded. One thread per core,
          # no oversubscription, capped at the number of targets.
          WORKERS=$(( NPROC < 5 ? NPROC : 5 ))
          [ "$WORKERS" -lt 1 ] && WORKERS=1
          echo "nproc=$NPROC -> --workers $WORKERS --omp-threads 1"
          echo "WORKERS=$WORKERS" >> "$GITHUB_ENV"
          # Measure REAL CPU time, not a modelled one. The report's
          # cost_cpu_seconds is computed as duration x omp_threads
          # (runner.py:1602) -- dividing it by wall time just returns
          # omp_threads, so it cannot tell 2 cores from 64, and reading it as
          # an observation is how a derived value gets quoted as a
          # measurement. /usr/bin/time -v reports user+sys from the kernel,
          # which is the number that actually answers "did the threads run".
          # `time` is installed above; guard anyway so a missing binary degrades
          # to "no CPU figure" instead of failing the benchmark itself.
          TIME_WRAP=""
          [ -x /usr/bin/time ] && TIME_WRAP="/usr/bin/time -v -o /tmp/tier1_time.txt"
          SECONDS=0
          $TIME_WRAP \
          python -m benchmarks.run \
            --dataset "$DATASET" \
            --tier 1 \
            --results-dir "$RESULTS_DIR" \
            --datasets-dir benchmarks/datasets \
            --workers "$WORKERS" \
            --omp-threads 1 \
            --verbose
          echo "tier1_wall_clock_seconds=$SECONDS"
          echo "TIER1_WALL=$SECONDS" >> "$GITHUB_ENV"

      # Emitting from inside the timed step would never run on a run that times
      # out -- and every Tier-1 run so far has. An instrument that only reports
      # once the problem is already solved is not an instrument. Separate step,
      # if: always(), so a killed run still records its configuration.
      - name: Report Tier-1 throughput
        if: always()
        run: |
          USER_S=$(awk -F': ' '/User time/{print $2}' /tmp/tier1_time.txt 2>/dev/null || echo "")
          SYS_S=$(awk -F': ' '/System time/{print $2}' /tmp/tier1_time.txt 2>/dev/null || echo "")
          MAXRSS=$(awk -F': ' '/Maximum resident/{print $2}' /tmp/tier1_time.txt 2>/dev/null || echo "")
          {
            echo "### Tier-1 throughput"
            echo ""
            echo "| runner cores | workers | omp threads | wall clock | CPU user (measured) | CPU sys (measured) | max RSS kB |"
            echo "|---|---|---|---|---|---|---|"
            echo "| ${NPROC:-n/a} | ${WORKERS:-n/a} | 1 | ${TIER1_WALL:-n/a} | ${USER_S:-n/a} | ${SYS_S:-n/a} | ${MAXRSS:-n/a} |"
            echo ""
            echo "CPU figures are from \`/usr/bin/time -v\` (kernel user+sys), NOT the report's"
            echo "\`cost_cpu_seconds\`, which is \`duration x omp_threads\` (runner.py:1602) and says"
            echo "nothing about achieved parallelism. \`n/a\` = the run was killed before that"
            echo "figure was written."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tier1-results-${{ env.DATASET }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}/
          # A green upload that delivered zero files is a green lie: fail loudly
          # instead. The _sweep_config.json sidecar guarantees >=1 file even when
          # the docking loop is killed at the cap, so this fires only on a real
          # collection failure, not on an expected cap-kill.
          if-no-files-found: error
          retention-days: 30

      - name: Parse report for PR comment
        if: github.event_name == 'pull_request'
        id: parse-report
        run: |
          # Find the most recently written markdown report
          REPORT=$(find "$RESULTS_DIR" -name "*.md" | sort -r | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            # Truncate to 65535 characters (GitHub comment limit)
            python -c "
          import sys, textwrap
          content = open('$REPORT').read()
          if len(content) > 65000:
              content = content[:65000] + '\n\n_[truncated — see artifact for full report]_'
          print(content)
          " > report_truncated.md
            echo "REPORT_BODY<<EOF" >> "$GITHUB_OUTPUT"
            cat report_truncated.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "REPORT_BODY=No report generated." >> "$GITHUB_OUTPUT"
          fi

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true   # posting comment is informational; never block the gate
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmark-tier1
          message: |
            ## Benchmark Tier 1 Results

            ${{ steps.parse-report.outputs.REPORT_BODY }}

            > _Generated by `benchmark-tier1.yml` · run [`${{ github.run_id }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_

      - name: Write job summary
        if: always()
        run: |
          REPORT=$(find "$RESULTS_DIR" -name "*.md" | sort -r | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark report found." >> "$GITHUB_STEP_SUMMARY"
          fi
