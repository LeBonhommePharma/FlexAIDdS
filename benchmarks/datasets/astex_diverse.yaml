# Astex Diverse Set — 85 protein-ligand complexes
#
# The Astex Diverse Set is a curated collection of 85 high-quality
# protein-ligand crystal structures used for benchmarking docking and
# scoring functions.  Selected for structural diversity and medicinal
# chemistry relevance.
#
# Reference: Hartshorn et al. (2007) J. Med. Chem. 50(4):726-741
#            https://doi.org/10.1021/jm061277y

slug: astex_diverse
name: "Astex Diverse Set"
benchmark_order: 1
description: >
  85 diverse, high-quality protein-ligand crystal structures for docking
  and scoring benchmark.  Covers all major drug target families with
  ligand-ready holo structures.

zenodo_doi: ""
download_url: "https://www.ccdc.cam.ac.uk/community/freeprod/astex-diverse-set/"
data_format: pdb
tier: 2
tier1_subset_size: 5

structural_states:
  - holo

# Full 85 PDB codes are hardcoded in DatasetRunner::astex_diverse_codes()
# IMPORTANT: tier-1 CI uses the first tier1_subset_size=5 entries.
# These 5 are confirmed to exist in benchmarks/astex_diverse/astex_diverse/ (uppercase IDs on disk).
targets:
  - 1gpk   # Carbonic anhydrase II (1GPK)
  - 1mq6   # Factor Xa (1MQ6)
  - 1n2j   # Thymidine kinase (1N2J)
  - 1t46   # PDGFR-beta (1T46)
  - 1t9b   # Androgen receptor (1T9B)
  # --- remaining targets (not required for tier-1 CI) ---
  - 2cet   # Factor Xa (2CET)
  - 2hb1   # Thrombin (2HB1)
  - 1g9v   # CDK2 (1G9V)
  - 1gm8   # Thrombin (1GM8)
  - 1hnn   # CDK2 (1HNN)
  - 1hp0   # Aldose reductase (1HP0)
  - 1hq2   # CDK2 (1HQ2)
  - 1ia1   # FKBP12 (1IA1)
  - 1igj   # CDK2 (1IGJ)
  - 1j3j   # CHK1 (1J3J)
  - 1jd0   # CDK2 (1JD0)
  - 1jje   # Thrombin (1JJE)
  - 1k3u   # Carbonic anhydrase II (1K3U)
  - 1ke5   # CDK2 (1KE5)
  - 1kzk   # CDK2 (1KZK)
  # NOTE: Full 85-target list is hardcoded in C++ (astex_diverse_codes()).

metrics:
  - docking_power_top1
  - docking_power_top3
  - scoring_power_pearson_r
  - scoring_power_rmse
  - mean_rmsd
  - median_rmsd
  - entropy_rescue_rate

expected_baselines:
  docking_power_top1: 0.70
  docking_power_top3: 0.85
  scoring_power_pearson_r: 0.65
  scoring_power_rmse: 2.10
  mean_rmsd: 2.30
  median_rmsd: 1.95
  entropy_rescue_rate: 0.30

baseline_tolerance: 0.05

published_baselines:
  docking_power_top1: 0.452
published_source: "Gaudreault & Najmanovich 2015 JCIM Table 2 (Astex native FLRP, ideal subset, top-1)"

# The published JCIM 2015 table reports Astex native FLRP top-1 at 45.2%
# (ideal subset). Top-10 is 66.7% and top-100 is 81.0%. The current
# expected_baselines are the FlexAIDdS target values used for regression
# checks; published_baselines are the historical FlexAID comparator.
