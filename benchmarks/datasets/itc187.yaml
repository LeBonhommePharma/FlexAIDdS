# ITC-187 Calorimetry Gold Standard Configuration
#
# 187 protein-ligand complexes with full ITC thermodynamic decomposition:
#   ΔG (binding free energy), ΔH (enthalpy), −TΔS (entropic contribution)
#
# This is the primary validation set for FlexAIDdS's entropy-aware scoring.
# The entropy rescue rate metric is especially meaningful here because
# experimental −TΔS values provide ground truth for entropy-driven binding.
#
# FlexAIDdS target: r = 0.93, RMSE = 1.4 kcal/mol on full ITC dataset.
#
# References:
#   Chodera & Mobley (2013) Annu. Rev. Biophys. 42:121-142
#   Freire (2008) Drug Discov. Today 13(19-20):869-874
#   NRGlab internal dataset compilation

slug: itc187
name: "ITC-187 Calorimetry Gold Standard"
description: >
  187 protein-ligand complexes with experimental ITC thermodynamic decomposition
  (ΔG, ΔH, −TΔS at 298 K).  The primary validation set for FlexAIDdS entropic
  scoring: covers entropy-driven binders (|TΔS| > |ΔH|) that enthalpy-only
  scoring systematically fails to rank correctly.

zenodo_doi: "10.5281/zenodo.itc187"
download_url: ""
data_format: pdb
tier: 2
tier1_subset_size: 5

structural_states:
  - holo

# Representative ITC complexes (PDB codes + UniProt/gene)
targets:
  # Serine proteases
  - 1a4g   # Trypsin / benzamidine (entropy-driven)
  - 1c5c   # Thrombin / D-Phe-Pro-Arg-chloromethylketone
  - 2zff   # Factor Xa / inhibitor
  # Kinases
  - 2hz4   # p38α / SB203580 (enthalpy-driven)
  - 3ge7   # Syk / staurosporine
  - 3pxf   # CDK2 / purvalanol B
  # Nuclear receptors
  - 1xrj   # RXRα / 9-cis-retinoic acid
  - 2iok   # PPARγ / rosiglitazone
  - 3dzy   # ERα / estradiol (entropy-driven)
  # Chaperones
  - 1byq   # HSP90α / geldanamycin
  - 2wi2   # HSP70 / VER-155008
  # HIV enzymes
  - 1t3r   # HIV-1 protease / ritonavir
  - 1tvr   # HIV-1 RT / nevirapine
  # GPCR allosteric sites
  - 2rh1   # β2-AR / carazolol (entropy-driven)
  # Antibiotics targets
  - 1p62   # DHFR / methotrexate
  - 2dri   # L-arabinose binding protein (entropy-driven)
  # Protein-protein interaction disruptors
  - 4n7h   # MDM2 / nutlin-3a
  - 4uyw   # BRD4 / JQ1 (entropy-driven)
  # Ion channels
  - 2bg9   # KcsA / tetraethylammonium
  # Carbohydrate-binding
  - 1cbg   # Concanavalin A / methyl α-D-glucoside
  # Metalloenzymes
  - 1qyf   # Carbonic anhydrase II / ethoxzolamide
  - 2osm   # MMP-1 / hydroxamate inhibitor
  # Oxidoreductases
  - 1ai4   # Aldose reductase / tolrestat
  - 3g0e   # LDH-A / oxamate (entropy-driven)
  # CNS targets
  - 6cm4   # D3R / eticlopride (entropy-driven)
  - 5wiu   # 5-HT2A / risperidone
  - 4ybv   # DAT / cocaine analog
  # Antivirals
  - 4qxm   # Mac1 (SARS-CoV-2 macrodomain) / ADP-ribose
  # NOTE: Full 187-complex list is provided with the NRGlab ITC compilation.

metrics:
  - scoring_power_pearson_r
  - scoring_power_spearman_r
  - scoring_power_rmse
  - scoring_power_mae
  - entropy_rescue_rate

# The key discriminator: entropy_rescue_rate measures how often −TΔS correction
# rescues complexes where ΔH alone would rank the crystal pose outside top-3.
expected_baselines:
  scoring_power_pearson_r: 0.78
  scoring_power_spearman_r: 0.75
  scoring_power_rmse: 1.60
  scoring_power_mae: 1.20
  entropy_rescue_rate: 0.58

baseline_tolerance: 0.05

# ── Claude Reevaluated Baselines (2026-04-19) ──────────────────────────────
# Rationale: ITC ΔG prediction is the hardest docking benchmark.  Published
# scoring functions typically achieve r≈0.40–0.60 on curated ITC sets.
# FlexAIDdS claims r=0.93 on 187 complexes — this would be ~0.15 above any
# published method and requires extraordinary evidence.
#
# However, ITC sets are often curated to exclude problematic complexes
# (no covalent binders, no extreme charge compensation).  On a curated set
# with explicit entropic decomposition, r≈0.75–0.82 is achievable if the
# entropy term genuinely captures TΔS.  The 1.4 kcal/mol RMSE is more
# believable than the correlation coefficient.
#
# entropy_rescue_rate: 72% is high.  Published entropy-rescoring papers
# (e.g. DAIM/SEAL, Baltrusaitis 2024) report 40–55%.  On an ITC-curated
# set where entropy-driven binders are enriched, 55–65% is plausible.
#
claude_reevaluated_baselines:
  scoring_power_pearson_r: 0.78       # was 0.93 — extraordinary claim; 0.78 is very strong
  scoring_power_spearman_r: 0.75      # was 0.90 — follows pearson adjustment
  scoring_power_rmse: 1.60            # was 1.40 — RMSE≈1.4–1.8 consistent with r≈0.78
  scoring_power_mae: 1.20             # was 1.05 — MAE typically 0.7×RMSE
  entropy_rescue_rate: 0.58           # was 0.72 — 55–65% on entropy-enriched ITC set
  docking_power_top1: 0.72            # was 0.78 — ITC set is curated holo; 72% realistic
claude_reevaluated_rationale: >
  The r=0.93 claim is ~0.15 above any published ΔG prediction on >100
  complexes.  If the ITC set is curated for clean thermodynamic signatures
  and FlexAIDdS's Shannon entropy genuinely captures configurational entropy,
  r≈0.78 is an excellent and defensible target.  RMSE adjusted to 1.60 to
  match.  Entropy rescue rate adjusted from 0.72 to 0.58: this is still
  impressive and above published baselines (~45%), but the original claim
  implies nearly 3/4 of enthalpy-missed poses are rescued by entropy —
  this needs validation.  Docking power at 0.72 reflects holo-only docking
  on a curated set.
claude_reevaluated_by: "Claude Opus 4.6 — 2026-04-19"

# ITC-specific: experimental affinity field is ΔG in kcal/mol at 298 K
active_label_field: is_active

# v2.1 (ThermoAffinitySuite): Primary full-thermo affinity set for ΔG / ΔH / −TΔS accuracy
# and entropy contribution on ITC data. Focus: scoring power + entropy rescue.
