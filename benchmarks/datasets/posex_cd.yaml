description: 'Cross-docking benchmark from the PoseX suite: 1312 tasks on recent (post-2021)
  protein-ligand complexes. Receptors are non-native (cross) conformations; ligands
  are cognate but docked into different structures of the same target. Strict test
  of generalization and handling of conformational changes. Complements Astex for
  modern AI vs physics benchmarking. Includes annotations for pocket similarity (TM-score)
  to pre-2022 pockets.


  Tier1 now uses 20 entries for better smoke testing.


  Prepped receptors in benchmarks/posex_cd/posex_cd/ (371 unique), ligands in benchmarks/posex_cd/ligands/
  . 1312 ready for tier2.'
