slug: posex_cd
docking_mode: cross_docking  # validated by validate_dataset_semantics.py
name: "PoseX Cross-Docking (1312)"
benchmark_order: 10
description: >
  Cross-docking benchmark from the PoseX suite: 1312 tasks on recent (post-2021)
  protein-ligand complexes. Receptors are non-native (cross) conformations;
  ligands are cognate but docked into different structures of the same target.
  Strict test of generalization and handling of conformational changes.
  Complements Astex for modern AI vs physics benchmarking.
  Includes annotations for pocket similarity (TM-score) to pre-2022 pockets.

  Tier1=5 (or 20) for smoke. Full is tier2.

  Structures obtained from iCloud pre-prepped benchmark_data/posex_cd/<entry>/
  (apo receptors + ligand sdfs) + atomic copies to local benchmarks/posex_cd/.
  Fallback RCSB for any missing rec (strip HETATM/solvent). All copies atomic (NamedTemporaryFile + os.replace).
  See benchmarks/posex_cd/README.md .

zenodo_doi: ""
download_url: "https://github.com/CataAI/PoseX"
data_format: pdb
tier: 2
tier1_subset_size: 5
structural_states:
- crossdock

