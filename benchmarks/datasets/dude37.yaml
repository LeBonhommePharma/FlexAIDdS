# DUD-E 37-Target Cross-Docking Subset
#
# 37 targets from the Directory of Useful Decoys Enhanced (DUD-E), selected
# to test cross-docking performance across holo, apo, and AlphaFold2 structures.
#
# Three receptor states per target allow assessment of:
#   - holo:  crystal structure with co-crystallised ligand (ideal)
#   - apo:   apo crystal structure (no bound ligand; practical scenario)
#   - af2:   AlphaFold2 predicted structure (computationally accessible)
#
# Entropy rescue rate is especially relevant for apo/AF2 receptors where
# induced-fit conformational entropy is significant.
#
# Reference: Mysinger et al. (2012) J. Med. Chem. 55(14):6582-6594
#            https://doi.org/10.1021/jm300687e
#
# AF2 structures: UniProt-mapped AlphaFold DB v4

slug: dude37
docking_mode: virtual_screening  # validated by validate_dataset_semantics.py
name: "DUD-E 37-Target Cross-Docking"
description: >
  37-target subset of DUD-E with holo, apo, and AlphaFold2 receptor structures
  for rigorous cross-docking assessment.  Tests VS enrichment and entropy-based
  rescue across three structural states that represent real-world docking scenarios.

zenodo_doi: "10.5281/zenodo.dude37"
download_url: "https://dude.docking.org/"
data_format: mol2
tier: 2
tier1_subset_size: 5

structural_states:
  - holo
  - apo
  - af2

targets:
  # Kinases
  - EGFR    # Epidermal growth factor receptor
  - CDK2    # Cyclin-dependent kinase 2
  - SRC     # Proto-oncogene tyrosine kinase Src
  - LCK     # Lymphocyte-specific protein tyrosine kinase
  - VGFR2   # Vascular endothelial growth factor receptor 2
  - ROCK1   # Rho-associated coiled-coil kinase 1
  - MK14    # p38α MAP kinase
  - MK01    # ERK2
  - MP2K1   # MEK1
  # Proteases
  - HIVPR   # HIV protease
  - THRB    # Thrombin
  - RENI    # Renin
  - FA7     # Coagulation factor VII
  - FA10    # Coagulation factor Xa
  # Nuclear receptors
  - PPARG   # Peroxisome proliferator-activated receptor γ
  - PPARA   # PPARα
  - PPARD   # PPARδ
  - RXRA    # Retinoid X receptor α
  - ESR1    # Estrogen receptor α
  - ESR2    # Estrogen receptor β
  - ANDR    # Androgen receptor
  - PRGR    # Progesterone receptor
  - MCR     # Mineralocorticoid receptor
  # Oxidoreductases
  - HMDH    # HMG-CoA reductase
  - CP2C9   # CYP2C9
  - CP3A4   # CYP3A4
  - AOFB    # MAO-B
  - PYRD    # Dihydroorotate dehydrogenase
  # Glycolytic enzymes
  - PYGM    # Glycogen phosphorylase
  - GLCM    # Glucocerebrosidase
  # Other druggable targets
  - BACE1   # β-secretase
  - AMPC    # AmpC β-lactamase
  - HDAC2   # Histone deacetylase 2
  - HDAC8   # Histone deacetylase 8
  - HIVRT   # HIV reverse transcriptase
  - PARP1   # Poly(ADP-ribose) polymerase 1
  - MMP13   # Matrix metalloproteinase 13

metrics:
  - ef_1pct
  - ef_5pct
  - log_auc
  - docking_power_top1
  - docking_power_top3
  - entropy_rescue_rate
  - hit_rate_top10
  - target_specificity_zscore

expected_baselines:
  ef_1pct: 15.2
  ef_5pct: 8.4
  log_auc: 0.65
  docking_power_top1: 0.76
  docking_power_top3: 0.88
  entropy_rescue_rate: 0.42
  hit_rate_top10: 0.38

baseline_tolerance: 0.05

# ── Claude Reevaluated Baselines (2026-04-19) ──────────────────────────────
# Rationale: DUD-E is a virtual-screening benchmark.  Published EF@1% ranges:
#   Vina: 1.5–7.0, Glide: 5.0–15.0, DOCK6: 3.0–8.0, GNINA: 6.0–18.0
# Cross-docking (apo/AF2) degrades performance by 30–50% vs holo.
# The 3-state design (holo/apo/AF2) means reported baselines should reflect
# holo performance; apo/AF2 results will be significantly lower.
#
# EF@1%=15.2 is high-end but achievable for a top method on DUD-E holo.
# logAUC=0.65 is strong (random baseline ~0.145; Vina ~0.35–0.50).
# entropy_rescue_rate=0.42 is reasonable for apo/AF2 scenarios.
# hit_rate_top10=0.38 is plausible for DUD-E.
#
claude_reevaluated_baselines:
  ef_1pct: 12.0                       # was 15.2 — high-end adjusted to mid-top tier
  ef_5pct: 6.8                        # was 8.4 — EF5% typically 50–60% of EF1%
  log_auc: 0.58                       # was 0.65 — GNINA range is 0.45–0.62
  docking_power_top1: 0.70            # was 0.76 — 3-state average lowers this
  docking_power_top3: 0.83            # was 0.88 — top-3 always 10–15% above top-1
  entropy_rescue_rate: 0.40           # was 0.42 — essentially unchanged
  hit_rate_top10: 0.35                # was 0.38 — slight adjustment
claude_reevaluated_rationale: >
  DUD-E metrics adjusted slightly downward.  EF@1% from 15.2 to 12.0:
  15.2 is top-3 method territory; 12.0 is still very strong.  logAUC from
  0.65 to 0.58: GNINA (CNN rescoring) achieves 0.45–0.62; entropy rescoring
  should be competitive but the 0.65 claim is at the very top.  Docking
  power adjusted to 0.70/0.83: the 3-state design means these are averages
  across holo+apo+AF2, and apo/AF2 docking is significantly harder.
  Entropy rescue rate unchanged — it's the key discriminator and 40% is
  defensible.
claude_reevaluated_by: "Claude Opus 4.6 — 2026-04-19"
active_label_field: is_active
