# CASF-2016 Benchmark Configuration
# Core Set 2016 of PDBbind — the standard four-power benchmark for structure-based scoring.
#
# Four evaluation powers:
#   1. Scoring power  — Pearson r + RMSE vs experimental Ki/Kd/IC50
#   2. Ranking power  — Spearman ρ for compound ranking within each target cluster
#   3. Docking power  — % top-1 pose with RMSD < 2.0 Å
#   4. Screening power — EF@1% for virtual screening across all 285 targets
#
# Reference: Su et al. (2019) J. Chem. Inf. Model. 59(2):895-913
#            https://doi.org/10.1021/acs.jcim.8b00545

slug: casf2016
docking_mode: affinity_scoring  # validated by validate_dataset_semantics.py
name: "CASF-2016"
description: >
  PDBbind Core Set 2016: 285 protein-ligand complexes with experimental binding
  affinities (Ki, Kd, IC50) spanning 57 protein clusters.  The gold standard for
  evaluating scoring, ranking, docking, and screening performance.

zenodo_doi: ""
download_url: "http://www.pdbbind.org.cn/casf.asp"
data_format: pdb
tier: 2
tier1_subset_size: 5

structural_states:
  - holo

# Tier-1 subset: 5 well-studied complexes spanning diverse protein families
# Full 285-target list is fetched during dataset acquisition.
targets:
  # Tier-1 subset actually held in this repository (the full CASF-2016 core set
  # is 285 complexes and is NOT enumerated here).
  #
  # IDENTITY COMMENTS CORRECTED 2026-09-11 (dataset identity audit, C3b).
  # Every inline name below was previously a DIFFERENT protein from the one the
  # PDB code denotes. Measured against data.rcsb.org in one batch: of the 30
  # codes, a token-overlap test against the RCSB polymer descriptions flagged
  # 27 CONTRADICTED; of the 3 it passed, only 1hvr is genuinely consistent on
  # reading (2obj and 4cra passed on a generic shared token: "kinase",
  # "factor"). Examples: 1a30 was labelled "Neuraminidase", RCSB says HIV-1
  # protease; 2hb1 was "Thrombin", RCSB says PTP1B; 5cpp was "CDK4/6", RCSB says
  # cytochrome P450-cam. The names below are the RCSB polymer-entity
  # descriptions, fetched per code, not recalled.
  #
  # 1a30 is commented out: it carries no non-polymer component, so the runner
  # now REFUSES it (DatasetRunner::is_non_dockable).
  # - 1a30  # TRIPEPTIDE GLU-ASP-LEU + HIV-1 PROTEASE  -- REMOVED: NON-DOCKABLE (no non-polymer component)
  - 1gpk   # ACETYLCHOLINESTERASE
  - 1hvr   # HIV-1 PROTEASE
  - 2cgr   # IGG2B-KAPPA NC6.8 FAB (HEAVY CHAIN) + IGG2B-KAPPA NC6.8 FAB (LIGHT CHAIN)
  - 2hb1   # Tyrosine-protein phosphatase non-receptor type 1
  - 1mq6   # COAGULATION FACTOR X LIGHT CHAIN + COAGULATION FACTOR X HEAVY CHAIN
  - 1n2j   # pantothenate synthetase
  - 2cet   # BETA-GLUCOSIDASE A
  - 3arp   # Chitinase A
  - 3acw   # Dehydrosqualene synthase
  - 1owi   # Urokinase-type plasminogen activator
  - 1ydt   # PROTEIN KINASE INHIBITOR PEPTIDE + C-AMP-DEPENDENT PROTEIN KINASE
  - 2cbj   # HYALURONIDASE
  - 3coy   # Pantothenate synthetase
  - 2obj   # Proto-oncogene serine/threonine-protein kinase Pim-1
  - 2qmj   # Maltase-glucoamylase, intestinal
  - 2weg   # CARBONIC ANHYDRASE 2
  - 2zyc   # Peptidoglycan hydrolase FlgJ
  - 3d4z   # Alpha-mannosidase 2
  - 3ge7   # Queuine tRNA-ribosyltransferase
  - 3lka   # Macrophage metalloelastase
  - 3mss   # Tyrosine-protein kinase ABL1
  - 4agp   # CELLULAR TUMOR ANTIGEN P53
  - 4bkt   # VON HIPPEL-LINDAU DISEASE TUMOR SUPPRESSOR + TRANSCRIPTION ELONGATION FACTOR B
  - 4cra   # Coagulation factor XIa light chain
  - 4e5w   # Tyrosine-protein kinase JAK1
  - 4gfm   # Tyrosine-protein kinase JAK2
  - 4hjr   # Tyrosine-tRNA ligase
  - 4roe   # Non-template strand + Template strand + ...
  - 5cpp   # CYTOCHROME P450-CAM
  # NOTE: Full list of 285 targets is provided in the CASF-2016 data package.
  # Set data_dir to the extracted CASF-2016/structures/ directory.


# ── Codes that cannot be docked, and codes that do not exist ────────────────
# Added 2026-09-11 (dataset identity audit, C3). Enforced in code by
# DatasetRunner::is_non_dockable(), which REFUSES these with a message rather
# than letting the runner emit an empty result that looks like a docking failure.
#
# Measured against data.rcsb.org, denominators and controls in the same call:
#   8 codes claimed ligand-free -> all 8 have nonpolymer_entity_count == 0
#   controls 1T46 (2 components) and 1G9V (3) are non-zero, so the 0 is a real
#   absence and not an empty-field artifact.
non_dockable:
  1A30: "no non-polymer component; ligand is the tripeptide GLU-ASP-LEU written as a polymer entity"
  1PSO: "no non-polymer component; ligand is PEPSTATIN written as a polymer entity"
  2WHB: "no non-polymer component; ligand is the peptide ARG-ARG-L3O-PFF written as a polymer entity"
  2YLB: "no non-polymer component, single polymer entity (protein Hfq) - no binding partner"
  2YPL: "no non-polymer component; 5 polymer entities (TCR/peptide-MHC) - protein-protein interface"
  3UAH: "no non-polymer component, single polymer entity (Shq1 domain) - no binding partner"
  3UPV: "no non-polymer component; 2 polymer entities (Hsp70/Sti1) - protein-protein interface"
  4KEL: "no non-polymer component; 2 polymer entities (KLK4 + SFTI peptide) - protein-peptide interface"

# Removed from LIB/DatasetRunner.cpp casf2016_codes() on 2026-09-11: 3QGS and
# 3RP3. Neither is a retrievable PDB entry. core/entry/ returns HTTP 404 for
# both (control 1T46 -> 200); neither appears in holdings/removed/entry_ids
# (n=6123, membership control 116L present), so neither is an obsoleted entry
# with a successor; holdings/unreleased reports status_code WDRN for both, i.e.
# depositions withdrawn before release. The C++ list went 285 -> 283 codes.
# NOTE: neither code ever appeared in this YAML (grep count 0 in both copies) -
# the defect was C++-only.
removed_nonexistent_codes:
  - "3QGS"  # WDRN, deposited 2011-01-24, never released
  - "3RP3"  # WDRN, deposited 2011-04-26, never released
metrics:
  - scoring_power_pearson_r
  - scoring_power_spearman_r
  - scoring_power_rmse
  - docking_power_top1
  - docking_power_top3
  - ef_1pct
  - log_auc
  - entropy_rescue_rate

# Expected performance baselines for FlexAIDdS.
# Regression is flagged when measured value drops below baseline × (1 - tolerance).
expected_baselines:
  scoring_power_pearson_r: 0.88
  scoring_power_spearman_r: 0.86
  scoring_power_rmse: 1.20
  docking_power_top1: 0.82
  docking_power_top3: 0.91
  ef_1pct: 12.5
  log_auc: 0.68
  entropy_rescue_rate: 0.35

# Fractional tolerance for regression detection (5% → flag if value < baseline × 0.95)
baseline_tolerance: 0.05

# ── Claude Reevaluated Baselines (2026-04-19) ──────────────────────────────
# Rationale: Cross-referenced against CASF-2016 leaderboard (Su et al. 2019),
# published docking-scoring benchmarks (AutoDock Vina r≈0.54, Glide r≈0.60,
# Gold r≈0.58, RF-Score r≈0.74), and typical entropy-correction literature.
#
# The original pearson_r=0.88 is extraordinarily high — no published method
# exceeds r≈0.80 on the full 285-complex CASF-2016 scoring power without
# system-specific fitting.  FlexAIDdS's Shannon+Voronoi entropy terms are
# novel but an r=0.88 claim needs extraordinary evidence.  A realistic first-
# run expectation is r≈0.65–0.75; r≈0.80 would be SOTA-class.
#
# Docking power: AutoDock Vina achieves ~60% top-1 on Astex; Glide ~72%.
# Entropy-aware rescoring could plausibly reach 70–78%.  Original 82% is
# optimistic but not impossible for a GA+entropy engine on holo structures.
#
# EF@1%: DUD-E/CASF screening benchmarks show top methods at EF1%=5–15.
# Original 12.5 is reasonable for a strong method.  logAUC 0.68 is high
# but within plausible range.
#
# entropy_rescue_rate: 35% is conservative and reasonable for a first metric
# on a non-curated set.
#
claude_reevaluated_baselines:
  scoring_power_pearson_r: 0.72       # was 0.88 — SOTA is ~0.74–0.80; 0.88 unproven
  scoring_power_spearman_r: 0.70      # was 0.86 — matches ~0.72–0.76 typical range
  scoring_power_rmse: 1.80            # was 1.20 — r=0.72 implies RMSE≈1.6–2.0 kcal/mol
  docking_power_top1: 0.74            # was 0.82 — Vina ~0.60, Glide ~0.72; entropy boost plausible
  docking_power_top3: 0.87            # was 0.91 — top-3 is always easier; 0.85–0.90 realistic
  ef_1pct: 12.5                       # was 12.5 — unchanged; within published range
  log_auc: 0.62                       # was 0.68 — strong methods 0.55–0.65 on CASF screening
  entropy_rescue_rate: 0.35           # was 0.35 — unchanged; conservative and reasonable
claude_reevaluated_rationale: >
  Scoring power (r=0.88) adjusted down to 0.72 because no published method
  achieves r>0.80 on full CASF-2016 without target-specific fitting.  RMSE
  inflated to match the revised correlation.  Docking power adjusted to
  0.74/0.87 (between Glide and Vina).  Screening metrics (EF, logAUC)
  adjusted slightly down to reflect realistic enrichment on 285 diverse
  targets.  Entropy rescue rate left unchanged at 0.35 — this is FlexAIDdS's
  unique discriminator and the claim is modest.
claude_reevaluated_by: "Claude Opus 4.6 — 2026-04-19"

# ── primary source (dataset-identity gate, rule 7/8) ──────────────────────
# The PUBLICATION is identified and registered: the DOI below resolves via
# CrossRef and is cached in tests/fixtures/doi_resolution/. What is NOT
# verified is that THIS roster was extracted from it -- no table extraction
# with a recorded locator was performed, so the paper-to-target-list mapping
# rests on this repository's own comments. That is why verified is false.
    #   The 2026-09-10 audit reports that only 115 of the 283 codes the engine
    #   executes overlap the published CASF-2016 core set. That figure is the
    #   audit's, repeated here, not re-measured. It is the reason this stays false.
primary_source:
  doi: 10.1021/acs.jcim.8b00545
  citation: >-
    Su et al. (2019) J. Chem. Inf. Model. 59:895-913, "Comparative Assessment of Scoring Functions: The CASF-2016 Update"
  verified: false
  reason: >-
    Publication identified and DOI registered; the extraction of this target
    list from it is NOT verified. No locator (table, page, supplementary file)
    has been recorded for any row. See SYSTEMIC_FIX_REPORT.md.
