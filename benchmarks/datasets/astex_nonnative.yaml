# SUPERSEDED BY: astex_nonnative_v2.yaml (this directory and the mirror).
# Nothing here is deleted: this file is kept in place as the provenance record
# for whatever consumed it. Two measured findings, neither of which a column
# correction can repair, because a cross-protein pair is not a cross-dock:
#
#  1. THE ROSTER CSV IS NOT A CROSS-DOCKING SET. benchmarks/astex_nonnative/
#     astex_non_native_set.csv holds 74 pairs, of which 66 are
#     CROSS_PROTEIN_INVALID: the two members are DIFFERENT PROTEINS, verified
#     by UniProt accession on both sides for 72 of the 74 pairs. Its
#     target_name column was fabricated — the (1hwi,1hww) pair is labelled
#     CDK2, while RCSB says 1HWI is HMG-CoA reductase and 1HWW is Golgi
#     alpha-mannosidase II — and its stated ligand_id matched NEITHER member
#     on 0/74 rows. Source: DATASET_IDENTITY_REPORT.md and
#     DATASET_REMEDIATION_C2C7.md (2026-09-10/11 dataset identity audit).
#
#  2. THE C++ TABLE THIS FILE DELEGATES TO IS A SECOND, INDEPENDENT DEFECT.
#     The comment below points the "full 65-target mapping" at
#     astex_nonnative_targets() in LIB/DatasetRunner.cpp. The FlexAID paper
#     defines the Astex non-native set as "apo and non-apo forms of 65
#     proteins FROM THE DIVERSE SET" (Gaudreault & Najmanovich 2015, JCIM,
#     doi:10.1021/acs.jcim.5b00078, Methods / "Docking Experiments", journal
#     page K = PDF page 11), so every native member must be an Astex Diverse
#     entry. Measured 2026-09-11 against this repository's own Hartshorn
#     Table 2 extraction (benchmarks/datasets/astex_diverse_hartshorn85.yaml):
#     only 24 of the 63 distinct native codes in that C++ table are Astex
#     Diverse entries at all. Example: the table lists 1G9V as the native of
#     family "ACE" (acetylcholinesterase); 1G9V is deoxy haemoglobin with
#     RSR-13.
#
# A non-native pair must dock the ligand of one structure into a DIFFERENT
# CONFORMER OF THE SAME PROTEIN. Neither artifact above satisfies that, which
# is why the replacement is a rebuild and not a correction.
# ============================================================================
#
# Astex Non-Native Set — 65 targets, ~1885 structures for cross-docking
#
# The Astex Non-Native set provides pairs of holo/apo structures for
# cross-docking evaluation.  For each of 65 targets, the native holo
# crystal provides the reference ligand, while alternative conformers
# serve as receptor structures for cross-docking.
#
# FlexAIDdS uses EntryRole::RECEPTOR_ONLY for alternative conformers,
# pairing them with the native holo ligand via paired_ligand_path.
#
# Reference: Verdonk et al. (2008) J. Chem. Inf. Model. 48(11):2214-2225
#            https://doi.org/10.1021/ci8002254
#   DOI corrected 2026-09-10 (dataset identity audit). This file previously cited
#   10.1021/ci800224j, which is UNREGISTERED: doi.org Handle API returns
#   responseCode 100 and CrossRef /works returns 404, with 10.1021/jm061277y as a
#   passing positive control in the same check. The real DOI for the paper named on
#   the line above was recovered by CrossRef bibliographic search (exact title match,
#   author Verdonk, J. Chem. Inf. Model. 48:2214-2225, 2008). No DOI was invented.

slug: astex_nonnative
docking_mode: cross_docking  # validated by validate_dataset_semantics.py
name: "Astex Non-Native Cross-Docking Set"
benchmark_order: 2
description: >
  65 protein targets with native holo structures plus alternative
  conformers for cross-docking.  Each target has 1 native structure
  (ligand extracted) + N alternative conformers (receptor-only,
  paired with native ligand).  Total ~1885 structures.

zenodo_doi: ""
download_url: "https://www.ccdc.cam.ac.uk/"
data_format: mmcif
tier: 2
tier1_subset_size: 3

structural_states:
  - holo
  - apo
  - alternative

# Representative targets. Full 65-target mapping is hardcoded in
# astex_nonnative_targets() (DatasetRunner.cpp).
targets:
  - ACE     # Acetylcholinesterase (24 alt conformers)
  - CDK2    # Cyclin-dependent kinase 2 (100+ alt conformers)
  - HIVPR   # HIV-1 protease (180+ alt conformers)
  - HSP90   # HSP90 (100+ alt conformers)
  - THR     # Thrombin (200+ alt conformers)
  - CA2     # Carbonic anhydrase II (100+ alt conformers)
  - ER      # Estrogen receptor (50+ alt conformers)
  - PTP1B   # Protein tyrosine phosphatase 1B (70+ alt conformers)
  - PPARg   # PPAR gamma (100+ alt conformers)
  - REN     # Renin (40+ alt conformers)
  # NOTE: Full 65 targets with native + alternative PDB codes
  # are hardcoded in C++ (astex_nonnative_targets()).

metrics:
  - crossdock_success_rate_2A
  - crossdock_success_rate_3A
  - crossdock_mean_rmsd
  - crossdock_median_rmsd
  - docking_power_top1
  - docking_power_top3
  - entropy_rescue_rate

# PROVENANCE of the values below.  Restored verbatim from 50aebaee (2026-04-19),
# where they lived in a labelled `claude_reevaluated_baselines:` block.
# c414e814 (2026-06-19) promoted the numbers into `expected_baselines` and
# deleted the label and the rationale in the same diff -- here, in hap2.yaml and
# in astex_diverse.yaml.
#
#   claude_reevaluated_by: "Claude Opus 4.6 - 2026-04-19"
#
#   crossdock_success_rate_2A: 0.32  # was 0.40 - top of published; 0.32 still excellent
#   crossdock_success_rate_3A: 0.52  # was 0.60 - follows 2A adjustment
#   crossdock_mean_rmsd:       3.10  # was 2.90 - consistent with 32% under 2A
#   crossdock_median_rmsd:     2.65  # was 2.40 - follows mean
#   docking_power_top1:        0.38  # was 0.45 - cross-docking is hard; 0.38 competitive
#   docking_power_top3:        0.55  # was 0.60 - follows top-1
#   entropy_rescue_rate:       0.22  # was 0.20 - cross-docking benefits most
#
#   rationale: "Cross-docking baselines adjusted down to reflect published
#   performance.  Original 40% under 2A is at the very top of published range
#   (Glide: 30-40%).  32% is still excellent and defensible. ... Entropy rescue
#   rate raised slightly from 0.20->0.22: cross-docking is the scenario where
#   entropy corrections should matter most (induced-fit conformational
#   entropy)."
expected_baselines:
  crossdock_success_rate_2A: 0.32
  crossdock_success_rate_3A: 0.52
  crossdock_mean_rmsd: 3.10
  crossdock_median_rmsd: 2.65
  docking_power_top1: 0.38
  docking_power_top3: 0.55
  entropy_rescue_rate: 0.22

baseline_tolerance: 0.05

published_baselines:
  crossdock_success_rate_2A: 0.385
published_source: "Gaudreault & Najmanovich 2015 JCIM Table 2 (Astex non-native FLRP, ideal subset, top-1)"

structure_recovery_policy:
  coordinate_format: mmCIF-first
  pdb_fallback: >
    Legacy PDB download is attempted only after mmCIF fails. PDB is not treated
    as authoritative for this benchmark because several legacy entries are no
    longer reliably downloadable as .pdb.
  ligand_donor_fallback: >
    If the nominal native structure has no extractable small-molecule HETATM
    ligand, keep the protein family in the benchmark by using the first
    same-family alternative conformer with an extractable ligand as the ligand
    donor. Entries are not curated out solely because the native HETATM ligand
    is absent.

# The JCIM 2015 table reports Astex non-native FLRP top-1 at 38.5%
# (ideal subset). Top-5 is 48.1%, top-10 is 57.7%, and top-100 is 80.8%.

