# HAP2 — 59 protein-ligand complexes from FlexAID original publication
#
# The HAP2 (Holo/Apo/Predicted) dataset was introduced in the original
# FlexAID publication for validating flexible docking with side-chain
# and backbone flexibility.  59 curated protein-ligand crystal structures
# spanning diverse target families.
#
# Reference: Gaudreault F. & Bhatt M. (2015) J. Chem. Inf. Model.
#            "FlexAID: Revisiting Docking on Non-Native-Complexes"
#            https://doi.org/10.1021/acs.jcim.5b00143

slug: hap2
name: "HAP2 (FlexAID JCIM 2015)"
description: >
  59 protein-ligand complexes used to validate FlexAID in the original
  JCIM 2015 publication (Gaudreault & Bhatt).  Covers holo, apo, and
  predicted structural states — the dataset that established FlexAID's
  ability to dock non-native protein conformations.

zenodo_doi: ""
download_url: "https://www.rcsb.org/"
data_format: pdb
tier: 1
tier1_subset_size: 10

structural_states:
  - holo
  - apo

# Full 59-target list is hardcoded in DatasetRunner::hap2_codes()
