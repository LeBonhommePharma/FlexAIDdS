# HAP2 — FlexAID JCIM 2015 holo/apo protein-pair benchmark
#
# The HAP2 (Holo/Apo protein pairs) subset was the third validation dataset
# in the original FlexAID publication, after Astex Diverse and Astex
# Non-Native. It validates docking into non-native protein conformations.
#
# Reference: Gaudreault F. & Najmanovich R.J. (2015)
#            "FlexAID: Revisiting Docking on Non-Native-Complex Structures"
#            J. Chem. Inf. Model. 55(7):1323-1336
#            https://doi.org/10.1021/acs.jcim.5b00078

slug: hap2
docking_mode: cross_docking  # validated by validate_dataset_semantics.py
name: "HAP2 (FlexAID JCIM 2015)"
benchmark_order: 3
description: >
  HAP2 holo/apo protein-pair benchmark used as the third validation set in
  the FlexAID JCIM 2015 publication (Gaudreault & Najmanovich), after Astex
  Diverse and Astex Non-Native. This config currently carries the 59 PDB
  codes hardcoded in DatasetRunner and marks HAP2 as the FlexAID-native
  benchmark for docking into non-native protein conformations.

zenodo_doi: ""
download_url: "https://www.rcsb.org/"
data_format: pdb
tier: 1
tier1_subset_size: 10

structural_states:
  - holo
  - apo

# Representative target list; the full HAP2 handling is hardcoded in
# DatasetRunner::hap2_codes().
targets:
  - 1a28   # Beta-trypsin / benzamidine
  - 1a4q   # Dihydrofolate reductase / methotrexate
  - 1a9m   # Thrombin / inhibitor
  - 1adb   # Alcohol dehydrogenase / NAD
  - 1ai5   # Ribonuclease A / inhibitor
  - 1b6m   # Carbonic anhydrase II / acetazolamide
  - 1b9v   # Alpha-thrombin / inhibitor
  - 1bma   # Beta-lactamase / inhibitor
  - 1c1b   # CDK2 / inhibitor
  - 1c5c   # HIV-1 protease / inhibitor
  - 1c83   # CDK2 / ATP analogue
  - 1cbx   # Carboxypeptidase A / inhibitor
  - 1cil   # Interleukin-1 beta / inhibitor
  - 1d3h   # Estrogen receptor / estradiol
  - 1d4p   # HIV-1 protease / inhibitor
  - 1dbb   # Trypsin / benzamidine
  - 1dwd   # Thymidylate synthase / inhibitor
  - 1eby   # Acetylcholinesterase / inhibitor
  - 1eed   # Enolase / inhibitor
  - 1eta   # Dihydrofolate reductase / biopterin
  - 1etr   # Estrogen receptor / raloxifene
  - 1f0r   # FGFR1 / inhibitor
  - 1f0s   # FGFR1 / inhibitor
  - 1fcx   # Factor Xa / inhibitor
  - 1fen   # ER-alpha / estradiol
  - 1fki   # FKBP-12 / FK506
  - 1fl3   # Falcipain / inhibitor
  - 1fpc   # Thrombin / inhibitor
  - 1gkc   # Grb2 / inhibitor
  - 1hpv   # HIV-1 protease / inhibitor
  - 1htf   # HIV-1 protease / inhibitor
  - 1hwi   # Thrombin / inhibitor
  - 1ida   # Dihydrofolate reductase / NADPH
  - 1igj   # Integrin / inhibitor
  - 1imb   # IMP dehydrogenase / inhibitor
  - 1ivc   # HIV-1 protease / inhibitor
  - 1k1j   # Thrombin / inhibitor
  - 1kzk   # CDK2 / inhibitor
  - 1lam   # Alpha-thrombin / inhibitor
  - 1lpm   # LpxC / inhibitor
  - 1meh   # Metalloproteinase / inhibitor
  - 1mld   # Malate dehydrogenase / NAD
  - 1mmv   # HIV-1 protease / inhibitor
  - 1mrk   # MurA / inhibitor
  - 1mts   # Methionine aminopeptidase / inhibitor
  - 1n2v   # Thymidine kinase / substrate
  - 1okl   # CDK2 / inhibitor
  - 1opk   # PTP1B / inhibitor
  - 1owe   # PTP1B / inhibitor
  - 1phd   # Phenol hydroxylase / inhibitor
  - 1poc   # Phospholipase A2 / inhibitor
  - 1qpj   # Renin / inhibitor
  - 1rbp   # Retinol-binding protein / retinol
  - 1stp   # Streptavidin / biotin
  - 1tlp   # Thermolysin / inhibitor
  - 1tmn   # Thermolysin / inhibitor
  - 1tni   # Thioredoxin / inhibitor
  - 1ulb   # Urokinase / inhibitor
  - 1unl   # HIV-1 protease / unliganded

metrics:
  - docking_power_top1
  - docking_power_top3
  - mean_rmsd
  - median_rmsd
  - entropy_rescue_rate
  - scoring_power_pearson_r
  - scoring_power_rmse

# Based on FlexAID JCIM 2015 reported performance on HAP2 holo/apo pairs,
# with entropy correction expected to improve non-native receptor docking.
expected_baselines:
  docking_power_top1: 0.60
  docking_power_top3: 0.76
  mean_rmsd: 2.55
  median_rmsd: 2.15
  entropy_rescue_rate: 0.30
  scoring_power_pearson_r: 0.55
  scoring_power_rmse: 2.30

baseline_tolerance: 0.08

published_baselines:
  docking_power_top1: 0.220
published_source: "Gaudreault & Najmanovich 2015 JCIM Table 2 (HAP2 native FLRP, ideal subset, top-1)"

# The JCIM 2015 table reports HAP2 native FLRP top-1 at 22.0%
# (ideal subset). Top-5 is 35.6%, top-10 is 39.0%, and top-100 is 59.3%.
