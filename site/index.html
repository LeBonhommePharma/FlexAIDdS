document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b81cbc55-adf3-443e-829f-af84428a2ff7\"><\u002Fscript>\n<style id=\"ix-canonical\">\n/* ==========================================================================\n   Canonical interaction spec — thebonhomme.com\n   Single source of truth for hover / focus / active / disabled states.\n\n   Loaded by every page: <link rel=\"stylesheet\" href=\"/interaction.css\">\n   (bundled pages inline this same text, and style.css @imports it).\n\n   Interaction colours are pinned to the triad here rather than to each\n   page's local --teal/--violet/--gold, because a few pages carry an older\n   palette (e.g. /entropy-driven/ has --teal:#20808D). Pinning is what makes\n   the highlight identical everywhere. Resting colours are untouched.\n\n   Dark-first. Triad only: teal #22D3EE, violet #A78BFA, gold #FBBF24.\n   ========================================================================== */\n\n:root {\n  --ix-teal: #22D3EE;\n  --ix-violet: #A78BFA;\n  --ix-gold: #FBBF24;\n  --ix-ease: cubic-bezier(.16, 1, .3, 1);\n}\n\n/* --- Transitions: explicit on every interactive element ------------------ */\na,\nbutton,\n.btn, .btn-primary, .btn-secondary, .btn-outline,\n.card, .feature-card, .eco-card, .module-card, .mech-card, .audit-card,\n.drug-card, .drug-card-featured,\n.link-chip, .module-chip, .footer-links a, .flinks a,\n.nav-links a, .nav-gh, .gh-link, .nav-back, .footer-back,\n.tg-btn, .nav-burger, .copy-btn,\n.install-tab, .tab-btn, .binding-phase-btn, .binding-play-btn, .ngl-btn,\n[data-ix-btn], [data-ix-btn-secondary], [data-ix-card], [data-ix-chip] {\n  /* !important: theme.css animates a broad `.theme-anim *` transition that\n     would otherwise drop transform/filter from the transition list. */\n  transition:\n    color .18s var(--ix-ease),\n    border-color .18s var(--ix-ease),\n    background-color .18s var(--ix-ease),\n    filter .18s var(--ix-ease),\n    transform .25s var(--ix-ease),\n    box-shadow .25s var(--ix-ease) !important;\n}\n\n/* --- 1. Primary button (filled / gradient CTA) -------------------------- */\n.btn-primary,\n[data-ix-btn] {\n  box-shadow: 0 0 26px color-mix(in srgb, var(--ix-violet) 32%, transparent);\n}\n\n.btn-primary:hover,\n[data-ix-btn]:hover {\n  transform: translateY(-1px);\n  filter: brightness(1.06);\n  box-shadow: 0 0 24px color-mix(in srgb, var(--ix-violet) 50%, transparent);\n}\n\n/* --- 2. Secondary / outline button --------------------------------------- */\n.btn-secondary,\n.btn-outline,\n[data-ix-btn-secondary] {\n  border-width: 1.5px;\n  background: transparent;\n  color: var(--text, #d4dced);\n}\n\n.btn-secondary:hover,\n.btn-outline:hover,\n[data-ix-btn-secondary]:hover,\n.install-tab:hover,\n.tab-btn:hover,\n.binding-phase-btn:hover,\n.binding-play-btn:hover,\n.ngl-btn:hover {\n  transform: translateY(-1px);\n  filter: brightness(1.06);\n  box-shadow: 0 0 18px color-mix(in srgb, var(--ix-teal) 30%, transparent);\n  border-color: var(--ix-teal);\n  color: var(--ix-teal);\n}\n\n/* --- 1 + 2. Active: settle back, never scale down ----------------------- */\nbutton:active,\n.btn:active, .btn-primary:active, .btn-secondary:active, .btn-outline:active,\n.install-tab:active, .tab-btn:active,\n.binding-phase-btn:active, .binding-play-btn:active, .ngl-btn:active,\n[data-ix-btn]:active, [data-ix-btn-secondary]:active {\n  transform: translateY(0);\n}\n\n/* --- 3. Chrome / icon button: colour only, no lift ---------------------- */\n.nav-gh:hover,\n.gh-link:hover,\n.tg-btn:hover,\n.nav-burger:hover,\n.copy-btn:hover,\n.nav-back:hover,\n[data-ix-chrome]:hover {\n  border-color: var(--ix-teal);\n  color: var(--ix-teal);\n  transform: none;\n  filter: none;\n  opacity: 1;\n  text-decoration: none;\n}\n\n/* --- 4. Nav link -------------------------------------------------------- */\n.nav-links a:hover,\n.nav-links button:hover,\n.nav-mobile-menu a:hover,\n.nav-right a:hover,\n[data-ix-nav]:hover {\n  color: var(--ix-teal);\n  text-decoration: none;\n  transform: none;\n  background: transparent;\n}\n\n/* Nav link that already rests in an accent colour: brighten, don't recolour. */\n.nav-links a[data-ix-accent]:hover,\n.nav-mobile-menu a[data-ix-accent]:hover,\n[data-ix-accent]:hover {\n  filter: brightness(1.2);\n  color: inherit;\n}\n\n/* --- 5. Card / clickable tile ------------------------------------------- */\n.card:hover,\n.feature-card:hover,\n.eco-card:hover,\n.module-card:hover,\n.mech-card:hover,\n.audit-card:hover,\n.drug-card:hover,\n.drug-card-featured:hover,\n[data-ix-card]:hover {\n  transform: translateY(-4px);\n  box-shadow: 0 14px 40px -14px var(--cc, var(--ix-teal));\n  border-color: var(--cc, var(--ix-teal));\n  text-decoration: none;\n}\n\n/* --- 6. Link chip / list row -------------------------------------------- */\n.link-chip:hover,\n.module-chip:hover,\n.footer-links a:hover,\n.flinks a:hover,\n[data-ix-chip]:hover {\n  border-color: var(--cc, var(--ix-teal));\n  background: color-mix(in srgb, var(--cc, var(--ix-teal)) 8%, transparent);\n  transform: translateX(4px);\n  color: var(--ix-teal);\n  text-decoration: none;\n}\n\n/* --- 7. Inline text link ------------------------------------------------ */\n/* Container-ish anchors (cards, buttons, chrome) are excluded so a card's\n   whole body doesn't recolour on hover. */\na:hover:not(.btn):not(.btn-primary):not(.btn-secondary):not(.btn-outline):not(.card):not(.feature-card):not(.eco-card):not(.module-card):not(.mech-card):not(.audit-card):not(.drug-card):not(.drug-card-featured):not(.nav-gh):not(.gh-link):not(.nav-back):not(.footer-back):not([data-ix-btn]):not([data-ix-btn-secondary]):not([data-ix-card]):not([data-ix-chrome]):not([data-ix-accent]) {\n  color: #22D3EE;\n  filter: brightness(1.15);\n  text-decoration: none;\n}\n\n/* CV / résumé resting colours are inline, so the hover has to outrank them. */\n.doc-page a:hover,\n[data-ix-doc] a:hover {\n  color: #22D3EE !important;\n}\n\n/* --- 8. Keyboard focus -------------------------------------------------- */\na:focus-visible,\nbutton:focus-visible,\nsummary:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--ix-teal);\n  outline-offset: 2px;\n  border-radius: 6px;\n}\n\n/* --- 9. Disabled -------------------------------------------------------- */\n[disabled],\n.disabled,\n[aria-disabled=\"true\"] {\n  opacity: .45;\n  cursor: not-allowed;\n}\n\n[disabled]:hover,\n.disabled:hover,\n[aria-disabled=\"true\"]:hover {\n  transform: none;\n  filter: none;\n  box-shadow: none;\n}\n\n/* --- 10. Reduced motion: keep colour, drop movement --------------------- */\n@media (prefers-reduced-motion: reduce) {\n  a, button,\n  .btn, .btn-primary, .btn-secondary, .btn-outline,\n  .card, .feature-card, .eco-card, .module-card, .mech-card, .audit-card,\n  .drug-card, .drug-card-featured,\n  .link-chip, .module-chip, .footer-links a, .flinks a,\n  .install-tab, .tab-btn, .binding-phase-btn, .binding-play-btn, .ngl-btn,\n  [data-ix-btn], [data-ix-btn-secondary], [data-ix-card], [data-ix-chip],\n  a:hover, button:hover,\n  .card:hover, .feature-card:hover, .eco-card:hover, .module-card:hover,\n  .drug-card:hover, .drug-card-featured:hover,\n  .link-chip:hover, .module-chip:hover, .footer-links a:hover, .flinks a:hover,\n  [data-ix-btn]:hover, [data-ix-btn-secondary]:hover,\n  [data-ix-card]:hover, [data-ix-chip]:hover {\n    transform: none;\n  }\n}\n\n/* --- Print: hover treatments must not bleed into printed output --------- */\n@media print {\n  a:hover {\n    filter: none;\n    color: inherit;\n    box-shadow: none;\n    transform: none;\n  }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font- 002Fspan>\n          <\u002Fdiv>\n          <span style=\"color:var(--teal);font-size:16px;animation:pulseArrow 2.4s ease-in-out infinite;\">›<\u002Fspan>\n        <\u002Fsc-for>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding-left:2px;\">pose &amp; affinity<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;margin-top:36px;flex-wrap:wrap;justify-content:center;\">\n        <a href=\"https://thebonhomme.com/FlexAIDdS/\" style=\"display:inline-flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--bg);background:var(--teal);padding:15px 24px;border-radius:8px;box-shadow:0 0 26px color-mix(in srgb,var(--violet) 32%,transparent);\" data-ix-btn=\"\" style-hover=\"transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 0 24px color-mix(in srgb,var(--violet) 50%,transparent);\">Explore FlexAID∆S →<\u002Fa>\n        <a href=\"#manifesto\" style=\"display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--text);padding:15px 24px;border-radius:8px;border:1.5px solid var(--border2);\" data-ix-btn-secondary=\"\" style-hover=\"transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 0 18px color-mix(in srgb,var(--teal) 30%,transparent);\">Read the Manifesto<\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:clamp(20px,5vw,34px);margin-top:44px;flex-wrap:wrap;justify-content:center;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(22px,5vw,26px);font-weight:700;color:var(--gold);\">96.4%<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;\">Astex · top pose<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-ite , straight from the CLI.<\u002Fp><\u002Fdiv><div style='position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.10);background:rgba(16,20,28,0.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 24px 60px -20px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.04) inset;'><div style='display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);'><span style='width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block;'><\u002Fspan><span style='width:11px;height:11px;border-radius:50%;background:#FEBC2E;display:inline-block;'><\u002Fspan><span style='width:11px;height:11px;border-radius:50%;background:#28C840;display:inline-block;'><\u002Fspan><span style='margin-left:8px;font-family:JetBrains Mono,monospace;font-size:11px;color:var(--muted);'>bash — flexaidds<\u002Fspan><\u002Fdiv><div ref='{{ terminalRef }}' style='padding:22px 24px;font-family:JetBrains Mono,monospace;font-size:12.5px;line-height:1.75;color:#d4dced;min-height:300px;white-space:pre-wrap;word-break:break-word;'><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><!-- MANIFESTO -->\n  <section id=\"manifesto\" style=\"position:relative;padding:clamp(64px,9vw,100px) clamp(18px,5vw,40px);border-top:1px solid var(--border);background:var(--surface2);\">\n    <div style=\"max-width:900px;margin:0 auto;\" data-reveal=\"\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--violet);margin-bottom:20px;\">Manifesto<\u002Fdiv>\n      <p style=\"max-width:none;font-size:clamp(19px,3.4vw,24px);line-height:1.5;color:var(--text);margin:0 0 26px;font-weight:500;\">The psychiatric system isn't broken — it was built for a different century. We're building the tools for <span style=\"color:var(--teal);\">this<\u002Fspan> one.<\u002Fp>\n      <p style=\"max-width:76ch;font-size:clamp(14px,2.2vw,16px);line-height:1.7;color:var(--muted);margin:0 0 18px;\"><span style=\"color:var(--green);\">Open-source. Thermodynamically rigorous. Unapologetically pro-drug<\u002Fspan> in the clinical sense that matters: every molecule is a hypothesis about biology, and the stigma attached to psychoactives has killed more people than the molecules themselves.<\u002Fp>\n      <p style=\"max-width:76ch;font-size:clamp(14px,2.2vw,16px);line-height:1.7;color:var(--muted);margin:0;\">From the <span style=\"color:var(--teal);\">statistical mechanics of ligand binding<\u002Fspan> to the social mechanics of <span style=\"color:var(--green);\">harm reduction<\u002Fspan>, the physics is the same: systems seek lower free energy. Our job is to lower the barrier — algorithmically, pharmacologically, politically.<\u002Fp>\n      <blockquote style=\"margin:40px 0 0;padding:26px clamp(20px,4vw,34px);border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent);border-radius:0 10px 10px 0;\">\n        <p style=\"max-width:none;margin:0;font-family:'JetBrains Mono',monospace;font-size:clamp(17px,3vw,22px);line-height:1.45;color:var(--text);font-weight:500;\">\"Drug is <span style=\"color:var(--gold);\">ALWAYS<\u002Fspan> an answer — sometimes the only one available.\"<\u002Fp>\n        <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);\">— @BonhommePharma<\u002Fdiv>\n      <\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRODUCTS -->\n  <section id=\"products\" style=\"padding:clamp(64px,9vw,100px) clamp(18px,5vw,40px);\">\n    <div style=\"max-width:1200px;margin:0 auto;\">\n      <div style=\"text-align:center;margin-bottom:48px;\" data-reveal=\"\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--violet);margin-bottom:14px;\">Open-Source Arsenal<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(30px,5.5vw,44px);letter-spacing:-0.02em;color:var(--text);\">What We Build<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"grid3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n        <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"7\">\n          <a href=\"{{ p.href }}\" data-reveal=\"\" style=\"--cc:{{ p.c }};display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid var(--border);border-top:2px solid var(--cc);border-radius:12px;background:var(--surface);transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1),border-color .18s cubic-bezier(.16,1,.3,1);\" data-ix-card=\"\" style-hover=\"transform:translateY(-4px);box-shadow:0 14px 40px -14px var(--cc);border-color:var(--cc);\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--cc);\">{{ p.kind }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--cc);\">{{ p.glyph }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--text);\">{{ p.name }}<\u002Fspan>\n              <sc-if value=\"{{ p.tag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cc);border:1px solid var(--cc);border-radius:999px;padding:2px 8px;animation:pulseArrow 2.6s ease-in-out infinite;\">{{ p.tag }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"max-width:none;margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);flex:1;\">{{ p.desc }}<\u002Fp>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--cc);margin-top:4px;\">{{ p.cta }} →<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRINCIPLES -->\n  <section style=\"padding:clamp(64px,9vw,100px) clamp(18px,5vw,40px);border-top:1px solid var(--border);background:var(--surface2);\">\n    <div style=\"max-width:1200px;margin:0 auto;\">\n      <div style=\"text-align:center;margin-bottom:48px;\" data-reveal=\"\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--violet);margin-bottom:14px;\">Operating Principles<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(30px,5.5vw,44px);letter-spacing:-0.02em;color:var(--text);\">The Physics First<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"grid2\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;\">\n        <sc-for list=\"{{ principles }}\" as=\"pr\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"padding:clamp(24px,4vw,32px);border:1px solid var(--border);border-radius:12px;background:var(--surface);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:{{ pr.c }};margin-bottom:14px;\">{{ pr.n }}<\u002Fdiv>\n            <h3 style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:clamp(19px,3.4vw,22px);font-weight:700;color:{{ pr.c }};\">{{ pr.title }}<\u002Fh3>\n            <p style=\"max-width:none;margin:0;font-size:14px;line-height:1.62;color:var(--muted);\">{{ pr.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOUNDER -->\n  <section id=\"about\" style=\"padding:clamp(64px,9vw,100px) clamp(18px,5vw,40px);\">\n    <div class=\"founder\" style=\"max-width:900px;margin:0 auto;display:grid;grid-template-columns:180px 1fr;gap:44px;align-items:start;\" data-reveal=\"\">\n      <div class=\"fcol\" style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\">\n        <div style=\"width:150px;height:150px;flex-shrink:0;border-radius:14px;overflow:hidden;border:1px solid var(--border2);box-shadow:0 0 22px color-mix(in srgb,var(--teal) 14%,transparent);animation:floatY 6s ease-in-out infinite;\">\n          <img src=\"19a1047a-87a6-4679-89b5-4557bfbef602\" alt=\"Louis-Philippe Morency\" style=\"width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block;\">\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);\">Founder<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(24px,5vw,32px);letter-spacing:-0.01em;color:var(--text);\">Louis-Philippe Morency<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);margin-top:6px;\">PhD Candidate · Psychopharmacology · Université de Montréal · NRGlab<\u002Fdiv>\n        <p style=\"max-width:none;font-size:15px;line-height:1.68;color:var(--muted);margin:18px 0 0;\">Built <span style=\"color:var(--gold);\">FlexAID∆S<\u002Fspan> because the field needed <span style=\"color:var(--teal);\">thermodynamically honest docking<\u002Fspan> and nobody else was going to do it from a basement in Little Burgundy. Main coder on FlexAID∆S, Shannon, ClusterFuck and NRGsuite — <span style=\"color:var(--gold);\">96.4%<\u002Fspan> on Astex Diverse 85, without crystal coordinates. Anti-prohibitionist. Writing a book on housing, organized crime, and <span style=\"color:var(--green);\">harm reduction<\u002Fspan> in Montréal. Shannon entropy and cats.<\u002Fp>\n        <div style=\"display:flex;gap:18px;margin-top:22px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12.5px;\">\n          <a href=\"https://github.com/LeBonhommePharma\" target=\"_blank\" rel=\"noreferrer noopener\">@LeBonhommePharma<\u002Fa>\n          <a href=\"mailto:lp@thebonhomme.com\">lp@thebonhomme.com<\u002Fa>\n          <a href=\"https://github.com/NRGlab\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:var(--muted);\">NRGlab · UdeM<\u002Fa>\n          <a href=\"resume.html\" style=\"color:var(--muted);\">Résumé<\u002Fa>\n          <a href=\"resume.pdf\" download style=\"color:var(--muted);\">PDF<\u002Fa>\n          <a href=\"cv.html\" style=\"color:var(--muted);\">Full CV<\u002Fa>\n          <a href=\"cv.pdf\" download style=\"color:var(--muted);\">PDF<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"padding:60px clamp(18px,5vw,40px) 40px;border-top:1px solid var(--border);background:var(--surface2);\">\n    <div class=\"ftop\" style=\"max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;\">\n      <div style=\"max-width:320px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--text);\">Le Bonhomme <span style=\"color:var(--gold);\">Pharma<\u002Fspan><\u002Fdiv>\n        <p style=\"max-width:none;font-size:13px;line-height:1.6;color:var(--muted);margin:10px 0 0;\">Radical open-source computational pharmacology. Little Burgundy · Montréal · Québec.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"flinks\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 40px;font-family:'JetBrains Mono',monospace;font-size:12px;\">\n        <a href=\"https://thebonhomme.com/FlexAIDdS/\" style=\"color:var(--muted);\">FlexAID∆S — docking engine<\u002Fa>\n        <a href=\"https://thebonhomme.com/entropy-driven/\" style=\"color:var(--muted);\">Entropy-Driven — landing<\u002Fa>\n        <a href=\"https://github.com/LeBonhommePharma/Shannon\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:var(--muted);\">Shannon — LLM entropy<\u002Fa>\n        <a href=\"https://github.com/LeBonhommePharma/NATURaL\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:var(--muted);\">ClusterFuck — biofeedback · <span style=\"color:var(--orange);\">pending<\u002Fspan><\u002Fa>\n        <a href=\"https://thebonhomme.com/entropy-docking/\" style=\"color:var(--muted);\">Entropy Docking — interactive<\u002Fa>\n        <a href=\"{{ dodHref }}\" style=\"color:var(--muted);\">Drug of the Day · <span style=\"color:var(--green);\">{{ dodName }}<\u002Fspan><\u002Fa>\n        <a href=\"https://thebonhomme.com/periodic/\" style=\"color:var(--muted);\">Periodic Table<\u002Fa>\n        <a href=\"resume.html\" style=\"color:var(--muted);\">Résumé — one page<\u002Fa>\n        <a href=\"resume.pdf\" download style=\"color:var(--muted);\">Résumé — PDF<\u002Fa>\n        <a href=\"cv.html\" style=\"color:var(--muted);\">Curriculum Vitæ — full<\u002Fa>\n        <a href=\"cv.pdf\" download style=\"color:var(--muted);\">Curriculum Vitæ — PDF<\u002Fa>\n        <a href=\"https://github.com/LeBonhommePharma/FlexAIDdS\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:var(--muted);\">GitHub — FlexAID∆S<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fbottom\" style=\"max-width:1200px;margin:36px auto 0;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.06em;color:var(--faint);\">\n      <span>© 2025–2026 Le Bonhomme Pharma · Apache 2.0 · Montréal, Québec<\u002Fspan>\n      <span><span style=\"color:var(--gold);\">∆G<\u002Fspan> = <span style=\"color:var(--teal);\">∆H<\u002Fspan> − <span style=\"color:var(--violet);\">T∆S<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;night&quot;,&quot;options&quot;:[&quot;night&quot;,&quot;day&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;,&quot;label&quot;:&quot;Default theme&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;,&quot;label&quot;:&quot;Animations &amp; reveals&quot;},&quot;showParticles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;,&quot;label&quot;:&quot;Molecular particle field&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:64,&quot;min&quot;:20,&quot;max&quot;:140,&quot;step&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;,&quot;label&quot;:&quot;Particle density&quot;}}\">\nclass Component extends DCLogic {\n  rootRef = React.createRef();\n  canvasRef = React.createRef(); terminalRef = React.createRef();\n  state = { theme: (this.props.defaultTheme === \"day\" ? \"day\" : \"night\"), menuOpen: false };\n\n  componentDidMount() {\n    this._applyBodyBg();\n    this._setupReveal();\n    this._setupParticles(); this._setupTerminal();\n  }\n  componentDidUpdate() { this._applyBodyBg(); }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf); if (this._termTimer) clearTimeout(this._termTimer); this._termStopped = true;\n    if (this._onResize) window.removeEventListener(\"resize\", this._onResize);\n  }\n  _applyBodyBg() {\n    document.body.style.background = this.state.theme === \"day\" ? \"#e9edf5\" : \"#0a0e14\";\n  }\n  _toggleTheme = () => this.setState(s => ({ theme: s.theme === \"day\" ? \"night\" : \"day\" }));\n  _toggleMenu = () => this.setState(s => ({ menuOpen: !s.menuOpen }));\n  _closeMenu = () => this.setState({ menuOpen: false });\n\n  _setupReveal() {\n    const root = this.rootRef.current;\n    if (!root || this.props.motion === false || !(\"IntersectionObserver\" in window)) return;\n    const els = Array.from(root.querySelectorAll(\"[data-reveal]\"));\n    els.forEach(el => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(20px)\";\n      el.style.transition = \"opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1)\";\n    });\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = \"1\";\n          e.target.style.transform = \"none\";\n          this._io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: \"0px 0px -8% 0px\" });\n    els.forEach(el => this._io.observe(el));\n  }\n\n  _setupParticles() {\n    const canvas = this.canvasRef.current;\n    if (!canvas) return;\n    if (this.props.motion === false || this.props.showParticles === false) return;\n    const ctx = canvas.getContext(\"2d\");\n    const PAL = { night: [\"#22D3EE\", \"#A78BFA\", \"#67E8F9\", \"#FBBF24\"], day: [\"#0E90AE\", \"#7C3AED\", \"#0E7490\", \"#B0680C\"] };\n    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);\n    let base = Math.max(16, Math.min(180, Math.round(this.props.density ?? 64)));\n    let nodes = [];\n    const seed = () => {\n      const small = window.innerWidth < 680;\n      const count = small ? Math.round(base * 0.5) : base;\n      nodes = new Array(count).fill(0).map(() => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - 0.5) * 0.28, vy: (Math.random() - 0.5) * 0.28,\n        r: Math.random() * 1.6 + 0.8,\n        ci: (Math.random() * 4) | 0,\n      }));\n    };\n    const resize = () => {\n      const rect = canvas.getBoundingClientRect();\n      w = rect.width; h = rect.height;\n      canvas.width = w * dpr; canvas.height = h * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      seed();\n    };\n    this._onResize = resize;\n    window.addEventListener(\"resize\", resize);\n    resize();\n    const LINK = 128;\n    const draw = () => {\n      const pal = PAL[this.state.theme] || PAL.night;\n      const lineA = this.state.theme === \"day\" ? 0.22 : 0.16;\n      const dotA = this.state.theme === \"day\" ? 0.55 : 0.7;\n      ctx.clearRect(0, 0, w, h);\n      for (let i = 0; i < nodes.length; i++) {\n        const n = nodes[i];\n        n.x += n.vx; n.y += n.vy;\n        if (n.x < -20) n.x = w + 20; if (n.x > w + 20) n.x = -20;\n        if (n.y < -20) n.y = h + 20; if (n.y > h + 20) n.y = -20;\n        for (let j = i + 1; j < nodes.length; j++) {\n          const m = nodes[j];\n          const dx = n.x - m.x, dy = n.y - m.y;\n          const d = Math.hypot(dx, dy);\n          if (d < LINK) {\n            ctx.globalAlpha = (1 - d / LINK) * lineA;\n            ctx.strokeStyle = pal[n.ci];\n            ctx.lineWidth = 0.6;\n            ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y); ctx.stroke();\n          }\n        }\n      }\n      for (const n of nodes) {\n        ctx.globalAlpha = dotA;\n        ctx.fillStyle = pal[n.ci];\n        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n      this._raf = requestAnimationFrame(draw);\n    };\n    draw();\n  }\n\n_setupTerminal() {const el = this.terminalRef && this.terminalRef.current;if (!el) return;const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;const lines = [{ t: 'cmd', s: '$ flexaidds dock --receptor 1a2b.pdb --ligand lig.sdf --config default.yaml' },{ t: 'out', s: '[flexaidds] v2.6.0 · genetic-algorithm docking · torsional ENCoM entropy' },{ t: 'out', s: '[flexaidds] target: 1a2b.pdb · bin () => typeLine(idx + 1), line.t === 'cmd' ? 260 : 90);}};step();};typeLine(0);}   renderVals() {\n    const drugs = [\n      { name: \"Cocaine HCl\", slug: \"cocaine\", live: true, note: \"competitive DAT/NET/SERT reuptake inhibitor · DAT Ki ≈ 250 nM\" },\n      { name: \"MDMA\", slug: \"mdma\", live: true, note: \"substrate-mediated SERT/NET/DAT efflux · SERT Ki = 34 nM · FDA Breakthrough Therapy\" },\n      { name: \"DMT\", slug: \"dmt\", live: true, note: \"endogenous 5-HT2A agonist · Ki ≈ 170 nM · near-zero tolerance\" },\n      { name: \"Psilocin\", slug: \"psilocin\", live: true, note: \"psilocybin's active metabolite · 5-HT2A Ki ~107 nM\" },\n      { name: \"LSD\", slug: \"lsd\", live: true, note: \"ergoline · 5-HT2A Ki ~1 nM · receptor lid-lock\" },\n      { name: \"Amphetamine\", slug: \"amphetamine\", live: true, note: \"DAT/NET substrate-releaser · DAT Ki ~1,400 nM\" },\n      { name: \"Fentanyl\", slug: \"fentanyl\", live: true, note: \"μ-opioid full agonist · MOR Ki ~1.1 nM · naloxone-reversible\" },\n      { name: \"Salvinorin A\", slug: \"salvinorin-a\", live: true, note: \"κ-opioid full agonist · KOR Ki ~1.8 nM · non-serotonergic\" },\n      { name: \"Ketamine\", slug: \"ketamine\", note: \"NMDA-receptor antagonist · dissociative anesthetic · esketamine FDA-approved for depression\" },\n      { name: \"Methamphetamine\", slug: \"methamphetamine\", note: \"TAAR1 agonist & monoamine releaser · Schedule II (Desoxyn)\" },\n      { name: \"Methylphenidate\", slug: \"methylphenidate\", note: \"DAT/NET reuptake inhibitor · ADHD (Ritalin)\" },\n      { name: \"Lisdexamfetamine\", slug: \"lisdexamfetamine\", note: \"amphetamine prodrug · ADHD (Vyvanse)\" },\n      { name: \"Modafinil\", slug: \"modafinil\", note: \"atypical DAT inhibitor · wakefulness-promoting (Provigil)\" },\n      { name: \"Morphine\", slug: \"morphine\", note: \"μ-opioid full agonist · prototypical analgesic\" },\n      { name: \"Oxycodone\", slug: \"oxycodone\", note: \"semi-synthetic μ-
