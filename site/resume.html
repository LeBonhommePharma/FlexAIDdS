document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"eee2baa2-f95d-4084-bb1f-3a552d10a794\"><\u002Fscript>\n<style id=\"ix-canonical\">\n/* ==========================================================================\n   Canonical interaction spec — thebonhomme.com\n   Single source of truth for hover / focus / active / disabled states.\n\n   Loaded by every page: <link rel=\"stylesheet\" href=\"/interaction.css\">\n   (bundled pages inline this same text, and style.css @imports it).\n\n   Interaction colours are pinned to the triad here rather than to each\n   page's local --teal/--violet/--gold, because a few pages carry an older\n   palette (e.g. /entropy-driven/ has --teal:#20808D). Pinning is what makes\n   the highlight identical everywhere. Resting colours are untouched.\n\n   Dark-first. Triad only: teal #22D3EE, violet #A78BFA, gold #FBBF24.\n   ========================================================================== */\n\n:root {\n  --ix-teal: #22D3EE;\n  --ix-violet: #A78BFA;\n  --ix-gold: #FBBF24;\n  --ix-ease: cubic-bezier(.16, 1, .3, 1);\n}\n\n/* --- Transitions: explicit on every interactive element ------------------ */\na,\nbutton,\n.btn, .btn-primary, .btn-secondary, .btn-outline,\n.card, .feature-card, .eco-card, .module-card, .mech-card, .audit-card,\n.drug-card, .drug-card-featured,\n.link-chip, .module-chip, .footer-links a, .flinks a,\n.nav-links a, .nav-gh, .gh-link, .nav-back, .footer-back,\n.tg-btn, .nav-burger, .copy-btn,\n.install-tab, .tab-btn, .binding-phase-btn, .binding-play-btn, .ngl-btn,\n[data-ix-btn], [data-ix-btn-secondary], [data-ix-card], [data-ix-chip] {\n  /* !important: theme.css animates a broad `.theme-anim *` transition that\n     would otherwise drop transform/filter from the transition list. */\n  transition:\n    color .18s var(--ix-ease),\n    border-color .18s var(--ix-ease),\n    background-color .18s var(--ix-ease),\n    filter .18s var(--ix-ease),\n    transform .25s var(--ix-ease),\n    box-shadow .25s var(--ix-ease) !important;\n}\n\n/* --- 1. Primary button (filled / gradient CTA) -------------------------- */\n.btn-primary,\n[data-ix-btn] {\n  box-shadow: 0 0 26px color-mix(in srgb, var(--ix-violet) 32%, transparent);\n}\n\n.btn-primary:hover,\n[data-ix-btn]:hover {\n  transform: translateY(-1px);\n  filter: brightness(1.06);\n  box-shadow: 0 0 24px color-mix(in srgb, var(--ix-violet) 50%, transparent);\n}\n\n/* --- 2. Secondary / outline button --------------------------------------- */\n.btn-secondary,\n.btn-outline,\n[data-ix-btn-secondary] {\n  border-width: 1.5px;\n  background: transparent;\n  color: var(--text, #d4dced);\n}\n\n.btn-secondary:hover,\n.btn-outline:hover,\n[data-ix-btn-secondary]:hover,\n.install-tab:hover,\n.tab-btn:hover,\n.binding-phase-btn:hover,\n.binding-play-btn:hover,\n.ngl-btn:hover {\n  transform: translateY(-1px);\n  filter: brightness(1.06);\n  box-shadow: 0 0 18px color-mix(in srgb, var(--ix-teal) 30%, transparent);\n  border-color: var(--ix-teal);\n  color: var(--ix-teal);\n}\n\n/* --- 1 + 2. Active: settle back, never scale down ----------------------- */\nbutton:active,\n.btn:active, .btn-primary:active, .btn-secondary:active, .btn-outline:active,\n.install-tab:active, .tab-btn:active,\n.binding-phase-btn:active, .binding-play-btn:active, .ngl-btn:active,\n[data-ix-btn]:active, [data-ix-btn-secondary]:active {\n  transform: translateY(0);\n}\n\n/* --- 3. Chrome / icon button: colour only, no lift ---------------------- */\n.nav-gh:hover,\n.gh-link:hover,\n.tg-btn:hover,\n.nav-burger:hover,\n.copy-btn:hover,\n.nav-back:hover,\n[data-ix-chrome]:hover {\n  border-color: var(--ix-teal);\n  color: var(--ix-teal);\n  transform: none;\n  filter: none;\n  opacity: 1;\n  text-decoration: none;\n}\n\n/* --- 4. Nav link -------------------------------------------------------- */\n.nav-links a:hover,\n.nav-links button:hover,\n.nav-mobile-menu a:hover,\n.nav-right a:hover,\n[data-ix-nav]:hover {\n  color: var(--ix-teal);\n  text-decoration: none;\n  transform: none;\n  background: transparent;\n}\n\n/* Nav link that already rests in an accent colour: brighten, don't recolour. */\n.nav-links a[data-ix-accent]:hover,\n.nav-mobile-menu a[data-ix-accent]:hover,\n[data-ix-accent]:hover {\n  filter: brightness(1.2);\n  color: inherit;\n}\n\n/* --- 5. Card / clickable tile ------------------------------------------- */\n.card:hover,\n.feature-card:hover,\n.eco-card:hover,\n.module-card:hover,\n.mech-card:hover,\n.audit-card:hover,\n.drug-card:hover,\n.drug-card-featured:hover,\n[data-ix-card]:hover {\n  transform: translateY(-4px);\n  box-shadow: 0 14px 40px -14px var(--cc, var(--ix-teal));\n  border-color: var(--cc, var(--ix-teal));\n  text-decoration: none;\n}\n\n/* --- 6. Link chip / list row -------------------------------------------- */\n.link-chip:hover,\n.module-chip:hover,\n.footer-links a:hover,\n.flinks a:hover,\n[data-ix-chip]:hover {\n  border-color: var(--cc, var(--ix-teal));\n  background: color-mix(in srgb, var(--cc, var(--ix-teal)) 8%, transparent);\n  transform: translateX(4px);\n  color: var(--ix-teal);\n  text-decoration: none;\n}\n\n/* --- 7. Inline text link ------------------------------------------------ */\n/* Container-ish anchors (cards, buttons, chrome) are excluded so a card's\n   whole body doesn't recolour on hover. */\na:hover:not(.btn):not(.btn-primary):not(.btn-secondary):not(.btn-outline):not(.card):not(.feature-card):not(.eco-card):not(.module-card):not(.mech-card):not(.audit-card):not(.drug-card):not(.drug-card-featured):not(.nav-gh):not(.gh-link):not(.nav-back):not(.footer-back):not([data-ix-btn]):not([data-ix-btn-secondary]):not([data-ix-card]):not([data-ix-chrome]):not([data-ix-accent]) {\n  color: #22D3EE;\n  filter: brightness(1.15);\n  text-decoration: none;\n}\n\n/* CV / résumé resting colours are inline, so the hover has to outrank them. */\n.doc-page a:hover,\n[data-ix-doc] a:hover {\n  color: #22D3EE !important;\n}\n\n/* --- 8. Keyboard focus -------------------------------------------------- */\na:focus-visible,\nbutton:focus-visible,\nsummary:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--ix-teal);\n  outline-offset: 2px;\n  border-radius: 6px;\n}\n\n/* --- 9. Disabled -------------------------------------------------------- */\n[disabled],\n.disabled,\n[aria-disabled=\"true\"] {\n  opacity: .45;\n  cursor: not-allowed;\n}\n\n[disabled]:hover,\n.disabled:hover,\n[aria-disabled=\"true\"]:hover {\n  transform: none;\n  filter: none;\n  box-shadow: none;\n}\n\n/* --- 10. Reduced motion: keep colour, drop movement --------------------- */\n@media (prefers-reduced-motion: reduce) {\n  a, button,\n  .btn, .btn-primary, .btn-secondary, .btn-outline,\n  .card, .feature-card, .eco-card, .module-card, .mech-card, .audit-card,\n  .drug-card, .drug-card-featured,\n  .link-chip, .module-chip, .footer-links a, .flinks a,\n  .install-tab, .tab-btn, .binding-phase-btn, .binding-play-btn, .ngl-btn,\n  [data-ix-btn], [data-ix-btn-secondary], [data-ix-card], [data-ix-chip],\n  a:hover, button:hover,\n  .card:hover, .feature-card:hover, .eco-card:hover, .module-card:hover,\n  .drug-card:hover, .drug-card-featured:hover,\n  .link-chip:hover, .module-chip:hover, .footer-links a:hover, .flinks a:hover,\n  [data-ix-btn]:hover, [data-ix-btn-secondary]:hover,\n  [data-ix-card]:hover, [data-ix-chip]:hover {\n    transform: none;\n  }\n}\n\n/* --- Print: hover treatments must not bleed into printed output --------- */\n@media print {\n  a:hover {\n    filter: none;\n    color: inherit;\n    box-shadow: none;\n    transform: none;\n  }\n}\n\n/* Doc pages: resting link colours are inline, so hover must outrank them. */\na:hover{color:#22D3EE !important;filter:brightness(1.15);text-decoration:none;}\n@media print{a:hover{filter:none;color:inherit;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"http 3, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"703ab49a-fdcb-4edd-9cf1-7017af9b618f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FlexAID∆S Design System — Colors & Type\n   Le Bonhomme Pharma · Montréal\n   Source: thebonhomme.com (live production site)\n   ============================================================ */\n\n/* --- FONTS -----------------------------------------------------\n   The brand uses two Google Fonts. No local TTFs are bundled —\n   import via the standard Google Fonts stylesheet.\n\n   <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n   <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n   <link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n   ------------------------------------------------------------ */\n\n/* BRAND FONT\n   Body/display sans uses the OS system stack (which resolves to\n   Apple's system face on Apple devices), falling back to IBM Plex\n   Sans from the Google Fonts CDN. No self-hosted font binaries. */\n\n\n\n\n\n\n\n\n\n\n:root {\n  /* ───────── CORE PALETTE (dark-first, scientific) ───────── */\n\n  /* Background ladder — near-black with cool blue cast */\n  --bg:           #0a0e14;        /* page bg                       */\n  --bg-panel:     rgba(16, 20, 28, 0.92);   /* nav / fixed panels */\n  --bg-card:      rgba(16, 20, 28, 0.80);   /* feature cards      */\n  --bg-alt:       rgba(12, 16, 22, 0.50);   /* alternating bands  */\n\n  /* Brand triad — the equation ΔG = ΔH − TΔS lives in these\n     colors. Each maps to a thermodynamic term and is referenced\n     consistently across UI, charts, and copy.                   */\n  --teal:    #22D3EE;   /* primary    · ΔH (enthalpy)   · CTA, brand mark */\n  --terra:   #A78BFA;   /* alert/heat · TΔS (entropy)   · alerts, section labels */\n  --gold:    #FBBF24;   /* highlight  · ΔG (free energy)· stats, key results */\n\n  /* Text */\n  --fg:       #d4dced;   /* primary text       */\n  --fg-muted: #8a93a8;   /* secondary, labels  */\n\n  /* ───────── ALPHA OVERLAYS ─────────\n     The brand layers translucent washes of the triad on the\n     dark bg instead of mixing solid mid-tones. Use these for\n     borders, hover backgrounds, and chip fills.                 */\n  --teal-06:  rgba(34,211,238,0.06);\n  --teal-08:  rgba(34,211,238,0.08);\n  --teal-10:  rgba(34,211,238,0.10);\n  --teal-15:  rgba(34,211,238,0.15);\n  --teal-20:  rgba(34,211,238,0.20);\n\n  --terra-10: rgba(167,139,250,0.10);\n  --terra-12: rgba(167,139,250,0.12);\n  --terra-25: rgba(167,139,250,0.25);\n  --terra-35: rgba(167,139,250,0.35);\n\n  --gold-06:  rgba(251,191,36,0.06);\n  --gold-10:  rgba(251,191,36,0.10);\n  --gold-12:  rgba(251,191,36,0.12);\n  --gold-35:  rgba(251,191,36,0.35);\n\n  /* ───────── SUPPORTING / KEYWORD ACCENTS ─────────\n     Spectrum keywords cycle these on a slow gradient flow.     */\n  --kw-entropy:  var(--terra);\n  --kw-statmech: var(--teal);\n  --kw-dg:       var(--gold);\n  --kw-ga:       #67E8F9;   /* lighter teal — genetic algorithm  */\n  --kw-open:     #FCD34D;   /* warm gold — open science          */\n  --kw-docking:  #5046D6;   /* lighter terra — docking           */\n  --kw-rescue:   #FDE68A;   /* light gold — binding mode rescue  */\n\n  /* ───────── TYPE SCALE ─────────\n     Body is the brand sans-serif (IBM Plex Sans by default — see Font families\n     card for live candidate options). Everything else (headings, badges, code,\n     stats) is JetBrains Mono. This is unusual but deliberate —\n     the brand reads as \"lab notebook with prose between\n     equations\".                                                */\n\n  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;\n  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;\n\n  /* Sizes */\n  --fs-hero:   7rem;     /* clamp down at small viewports        */\n  --fs-h1:     3.5rem;\n  --fs-h2:     1.75rem;\n  --fs-h3:     1.125rem;\n  --fs-body:   1rem;\n  --fs-sm:     0.875rem;\n  --fs-xs:     0.75rem;\n  --fs-tag:    0.625rem;  /* 10px — section labels, badges      */\n  --fs-meta:   0.5rem;    /* 8px  — entropy meter labels        */\n\n  /* Weights — body never bolder than 600; mono goes to 700 */\n  --fw-300: 300; /* @kind font */\n  --fw-400: 400; /* @kind font */\n  --fw-500: 500; /* @kind font */\n  --fw-600: 600; /* @kind font */\n  --fw-700: 700; /* @kind font */\n\n  /* Tracking */\n  --tracking-tight: -0.02em;\n  --tracking-flat:  0;\n  --tracking-wide:  0.08em;\n  --tracking-label: 0.15em;\n  --tracking-tag:   0.20em;\n  --tracking-meta:  0.30em;\n\n  /* Line heights */\n  --lh-tight: 1.05; /* @kind font */\n  --lh-snug:  1.15; /* @kind font */\n  --lh-body:  1.60; /* @kind font */\n  --lh-code:  1.80; /* @kind font */\n\n  /* ───────── SPACING ───────── (8-pt soft grid) */\n  --sp-1:  0.25rem;\n  --sp-2:  0.5rem;\n  --sp-3:  0.75rem;\n  --sp-4:  1rem;\n  --sp-5:  1.25rem;\n  --sp-6:  1.5rem;\n  --sp-8:  2rem;\n  --sp-10: 2.5rem;\n  --sp-12: 3rem;\n  --sp-16: 4rem;\n  --sp-20: 5rem;\n  --sp-24: 6rem;\n\n  /* ───────── RADIUS ───────── conservative; cards 8px, pills 9999 */\n  --r-xs:   3px;        /* badges, chips                          */\n  --r-sm:   6px;        /* small buttons                          */\n  --r-md:   8px;        /* cards, default                         */\n  --r-lg:   12px;       /* hero panels                            */\n  --r-pill: 9999px;     /* entropy meter bar                      */\n\n  /* ───────── SHADOWS / GLOWS ─────────\n     The brand prefers colored glow over neutral drop-shadow.    */\n  --glow-teal:  0 0 18px rgba(34,211,238,0.30);\n  --glow-teal-strong: 0 0 24px rgba(34,211,238,0.50);\n  --glow-terra: 0 0 20px rgba(167,139,250,0.10);\n  --glow-gold:  0 0 20px rgba(251,191,36,0.10);\n  --glow-equation: 0 0 40px rgba(34,211,238,0.4), 0 0 60px rgba(251,191,36,0.2);\n\n  /* ───────── MOTION ─────────\n     Easings used across hover, fade-in, and the keyword\n     spectrum animation.                                         */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out: ease-in-out; /* @kind other */\n  --dur-fast: 0.18s; /* @kind other */\n  --dur-base: 0.25s; /* @kind other */\n  --dur-slow: 0.7s; /* @kind other */\n  --dur-breathe: 4s; /* @kind other */\n  --dur-spectrum: 8.5s; /* @kind other */\n\n  /* ───────── GRID BACKGROUND ─────────\n     Fine teal grid at 40px, always-on under content.            */\n  --grid-line: rgba(34,211,238,0.03);\n  --grid-step: 40px;\n}\n\n/* ───────── SEMANTIC ELEMENT STYLES ─────────\n   Apply these to bare HTML in design output. They reproduce the\n   live thebonhomme.com look without per-element overrides.    */\n\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\n\nbody {\n  font-family: var(--font-body);\n  font-size:   var(--fs-body);\n  line-height: var(--lh-body);\n  color:       var(--fg);\n  background:  var(--bg);\n  /* The signature subtle grid */\n  background-image:\n    linear-gradient(var(--grid-line) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);\n  background-size: var(--grid-step) var(--grid-step);\n}\n\nh1, .h1 {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-h1);\n  font-weight: var(--fw-700);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-flat);\n  color: var(--fg);\n}\n\nh2, .h2 {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-h2);\n  font-weight: var(--fw-700);\n  line-height: var(--lh-snug);\n  color: var(--fg);\n}\n\nh3, .h3 {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-h3);\n  font-weight: var(--fw-600);\n  color: var(--fg);\n}\n\np {\n  font-family: var(--font-body);\n  font-size:   var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-muted);\n  max-width: 72ch;\n  text-wrap: pretty;\n}\n\n/* Mono runs — code, badges, section labels, stats */\ncode, .mono, kbd, samp {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-sm);\n}\n\n/* Section eyebrow — terra, uppercase, wide tracking */\n.section-label, .eyebrow {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-tag);\n  font-weight: var(--fw-500);\n  letter-spacing: var(--tracking-tag);\n  text-transform: uppercase;\n  color: var(--terra);\n}\n\n/* Stat block — big mono number + tiny tracked label */\n.stat-value {\n  font-family: var(--font-mono);\n  font-size:   2.5rem;\n  font-weight: var(--fw-700);\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n}\n.stat-label {\n  font-family: var(--font-mono);\n  font-size:   var(--fs-tag);\n  letter-spacing: var(--tracking-label);\n  color: var(--fg-muted);\n  text-transform: uppercase;\n  margin-top: var(--sp-1);\n}\n\n/* Brand wordmark — the ∆S is always gold */\n.brand {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-700);\n  color: var(--teal);\n  letter-spacing: 0.02em;\n}\n.brand .delta { color: var(--gold); }\n.brand .terra { color: var(--terra); }\n<\u002Fstyle>\n<style>\n  doc-page:not(:defined){visibility:hidden}\n  ::selection{background:rgba(34,211,238,0.25);}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"doc-page\" from=\"5b9dffed-617c-49cf-be10-0f5b093cfb9f#/doc-page.js\" size=\"letter\" margin=\"0\" hint-size=\"100%,100%\">\n  <div style=\"position:relative;min-height:100%;background:#0a0e14;color:#d4dced;font-family:-apple-system,sans-serif;padding:0.62in 0.66in;line-height:1.5;--c-h:{{
