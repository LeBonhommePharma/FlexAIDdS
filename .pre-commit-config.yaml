# FlexAIDdS pre-commit hooks (optional local install).
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run all hooks on staged files:
#   pre-commit run
#
# clang-format only touches staged C/C++ files. Prefer scripts/format_check.sh
# for PR checks against an allowlist without rewriting history.

default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: '3.0.0'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: >
          (?x)^(
            benchmarks/astex_diverse/.*\.(pdb|cif|sdf)|
            .*\.png|
            .*\.pdf
          )$
      - id: end-of-file-fixer
        exclude: >
          (?x)^(
            benchmarks/astex_diverse/.*\.(pdb|cif|sdf)|
            .*\.png|
            .*\.pdf
          )$
      - id: check-yaml
        args: [--unsafe]
        exclude: >
          (?x)^(
            \.github/workflows/.*|
            mkdocs\.yml
          )$
      - id: check-toml
      - id: check-added-large-files
        # Dataset trees and results must not land via casual adds.
        # Canonical Astex structures are already tracked; this blocks *new* blobs.
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      - id: repo-hygiene
        name: FlexAIDdS repo hygiene
        entry: python3 scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: >
          (?x)^(
            LIB/third_party/.*|
            \.tools/.*|
            build.*/.*
          )$
