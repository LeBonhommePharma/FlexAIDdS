[build-system]
requires = ["setuptools>=82.0.1", "wheel", "pybind11>=3.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flexaidds"
dynamic = ["version"]
description = "Python bindings and analysis tools for the FlexAID∆S thermodynamic docking engine"
authors = [
  { name = "Louis-Philippe Morency" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
benchmarks = ["numpy>=2.0.2", "pyyaml>=6.0.3"]
benchmarks-mpi = ["numpy>=2.0.2", "pyyaml>=6.0.3", "mpi4py>=4.1.1"]

[project.scripts]
flexaidds = "flexaidds.__main__:main"
flexaidds-benchmark = "flexaidds.dataset_runner.cli:main"

[project.urls]
Homepage = "https://github.com/LeBonhommePharma/FlexAIDdS"
Documentation = "https://github.com/LeBonhommePharma/FlexAIDdS/tree/master/docs"
Source = "https://github.com/LeBonhommePharma/FlexAIDdS"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flexaidds*"]
namespaces = false

[tool.setuptools.package-data]
"flexaidds" = ["py.typed"]
"flexaidds.dataset_runner" = ["datasets/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "flexaidds.__version__.__version__" }
