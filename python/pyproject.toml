[build-system]
requires = ["setuptools>=82.0.1", "wheel", "pybind11>=3.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flexaidds"
# Static version (keep in sync with flexaidds/__version__.py).
# Do NOT use dynamic attr = "flexaidds.__version__.__version__": importing
# that path executes flexaidds/__init__.py, which needs numpy — and numpy is
# not a build-system dependency. That produced UNKNOWN-0.0.0 wheels on clean
# / older pip builds (the classic PyPI installer failure mode).
version = "2.0.3"
description = "Python bindings and analysis tools for the FlexAID∆S thermodynamic docking engine"
authors = [
  { name = "Louis-Philippe Morency" },
]
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
# numpy is imported by core modules (io, docking, thermodynamics helpers, etc.)
dependencies = [
  "numpy>=1.22",
  # linear_sum_assignment, for the symmetry-corrected RMSD (benchmark.py).
  # Imported unguarded in the pass/fail path, so it must be a hard dependency.
  "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# DatasetRunner YAML configs + extra analysis stack
benchmarks = ["pyyaml>=6.0.3"]
benchmarks-mpi = ["pyyaml>=6.0.3", "mpi4py>=4.1.1"]
yaml = ["pyyaml>=6.0.3"]

[project.scripts]
flexaidds = "flexaidds.__main__:main"
flexaidds-benchmark = "flexaidds.dataset_runner.cli:main"
flexaidds-fleet = "flexaidds.fleet:main"

[project.urls]
Homepage = "https://github.com/LeBonhommePharma/FlexAIDdS"
Documentation = "https://github.com/LeBonhommePharma/FlexAIDdS/tree/master/docs"
Source = "https://github.com/LeBonhommePharma/FlexAIDdS"
Issues = "https://github.com/LeBonhommePharma/FlexAIDdS/issues"
Changelog = "https://github.com/LeBonhommePharma/FlexAIDdS/blob/master/VERSION.md"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flexaidds*"]
namespaces = false

[tool.setuptools.package-data]
"flexaidds" = ["py.typed"]
"flexaidds.dataset_runner" = ["datasets/*.yaml"]

# cibuildwheel: produce installable wheels even when the optional C++ extension
# cannot be compiled (pure-Python fallback). setup.py never fails the install.
[tool.cibuildwheel]
build-frontend = "build"
# Skip exotic / EOL targets that inflate CI without real users.
skip = "pp* *-win32 *-manylinux_i686 *-musllinux_i686"
test-command = "python -c \"import flexaidds as fd; print(fd.__version__)\""
test-skip = ""

[tool.cibuildwheel.linux]
# Prefer modern manylinux images; extension may still fall back pure-Python
# when the image compiler lacks C++26.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.cibuildwheel.windows]
# MSVC via cibuildwheel; extension optional.
