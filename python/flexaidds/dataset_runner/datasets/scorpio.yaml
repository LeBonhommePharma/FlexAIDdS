# SCORPIO ITC (ITC-enriched)
slug: scorpio
name: "SCORPIO ITC (ITC-enriched)"
description: >
  ITC-enriched set focused on entropy/enthalpy decomposition.
  Primary for thermo ledger validation at 298 K.

zenodo_doi: ""
download_url: ""
data_format: pdb
tier: 2
tier1_subset_size: 5

structural_states:
  - holo

targets:
