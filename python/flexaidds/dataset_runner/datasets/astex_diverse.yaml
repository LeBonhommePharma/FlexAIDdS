# Astex Diverse Set — 85 protein-ligand complexes
#
# Expanded Verdonk/Gaudreault benchmark set used by DatasetRunner.cpp
# (astex_diverse_codes()).
#
# CANONICAL structure tree (repo):
#   benchmarks/astex_diverse/astex_diverse/<PDB>/
# Runtime cache (not source of truth):
#   ~/.flexaidds/benchmarks/astex_diverse/<PDB>/
# See benchmarks/datasets/CANONICAL.md and astex_diverse_sha256.csv.
# Deprecated nested copy: benchmarks/astex_diverse/data/astex_diverse/
#
# Reference: Hartshorn et al. (2007) J. Med. Chem. 50(4):726-741
#            https://doi.org/10.1021/jm061277y

slug: astex_diverse
docking_mode: self_docking  # validated by validate_dataset_semantics.py
name: "Astex Diverse Set"
benchmark_order: 1
description: >
  85 diverse, high-quality protein-ligand crystal structures for docking
  and scoring benchmark.  Covers all major drug target families with
  ligand-ready holo structures.

# Canonical on-disk structures committed in this repository (not the runtime cache).
canonical_data_root: benchmarks/astex_diverse/astex_diverse
checksum_manifest: benchmarks/datasets/astex_diverse_sha256.csv
canonical_doc: benchmarks/datasets/CANONICAL.md


zenodo_doi: ""
download_url: "https://www.ccdc.cam.ac.uk/community/freeprod/astex-diverse-set/"
data_format: pdb
tier: 2
# CI TIME BUDGET (measured, not guessed). Worst per-target docking wall time on a
# 4-core ubuntu-latest runner at --omp-threads 1 is 1614 s = 26.9 min (Tier-1 run
# 31052481958: 1gpk 1056.7 s, 1mq6 1614.0 s). Targets run in batches of `workers`,
# so wall ~= ceil(n / workers) * 26.9 min.
#
# Tier-1 uses workers = min(nproc, 5) = 4 and its docking step is capped at 105 min:
#   n=2 -> 26.9 min   n=4 -> 26.9 min   n=8 -> 53.8 min   n=16 -> 107.6 min (OVER)
# n=4 costs the SAME wall as n=2 (both are one batch of 4) while doubling coverage,
# so 4 is the free-coverage point. Raising it further does cost real minutes.
tier1_subset_size: 4
# Tier-1 samples a RANDOM subset of `tier1_subset_size` targets rather than always
# the first N, so coverage rotates instead of leaving 83 of the 85 codes untested.
# The draw is seeded and logged: re-run with FLEXAIDDS_TIER1_SEED=<logged seed> to
# reproduce a draw exactly. Seed precedence: FLEXAIDDS_TIER1_SEED > tier1_seed >
# UTC date (YYYYMMDD).
#
# CONSEQUENCE: metrics below are target-dependent, so two runs with DIFFERENT
# seeds are not comparable to each other and a regression flag from a fresh draw
# is not evidence on its own. Compare only runs reporting the same seed.
tier1_selection: random
# Pin the library-path seed so a local / workflow_dispatch reproduction without
# FLEXAIDDS_TIER1_SEED still matches the CI gate. CI's env var overrides this.
# Rotate this value and .github/workflows/benchmark-tier1.yml
# FLEXAIDDS_TIER1_SEED together; never one without the other.
tier1_seed: 20260816

# WALL-TIME exclusions (NOT science exclusions). Targets are removed from the
# eligible pool before selection in BOTH fixed and random modes. This says
# "too slow for this job budget", never "too hard": excluded targets remain
# fully eligible for tier-2 and campaign runs.
#
# Screened by RECEPTOR SIZE (apo ATOM+HETATM count), not by timeout incidents.
# Timeout-only exclusion of 2bys left the next oversized target (1of6, larger
# than 2bys) eligible. Counts measured 2026-08-16 from
# $FLEXAIDDS_LOCAL_ROOT/cache_v2/astex_diverse/<PDB>/<PDB>_apo.pdb (85 targets).
#
#   n=85  min=1614  median=3729  Q3=5747  IQR=3117
#   Tukey outer fence Q3+3·IQR = 15098  (4× median = 14916)
#   Threshold: apo atoms > 15098 (extreme outliers).
#
#   1of6  21501  (5.77× median)  excluded
#   2bys  18241  (4.89× median)  excluded; also timed out at 3600 s on 2026-08-16
#   1n1m  12843  (3.44×)  KEPT — inner fence only; unmeasured wall time
#   1u1c  11775  (3.16×)  KEPT
#   1q1g  11523  (3.09×)  KEPT
#   1sq5  10535  (2.83×)  KEPT
#   1t9b  10458  (2.80×)  KEPT
#   1gpk   4782           KEPT — anchor; ran 1619 s
#   1x8x   2762           KEPT — ran 1219 s
#   2c3i   2403           KEPT — newly pinned; unmeasured wall; ~1mq6 size
#   1mq6   2385           KEPT — anchor; ran 2455 s (ligand DoF, not size)
#
# Re-admission requires a clean run under the CURRENT 5400 s CI cap.
tier1_wall_time_exclusions:
  - 1of6
  - 2bys

# Anchor targets: pinned into EVERY draw, so a fixed core of each run stays
# directly comparable run-to-run while the remaining slots rotate for coverage.
# 1gpk and 1mq6 are the historical pair (every Tier-1 run before #400 used exactly
# these two), so their numbers are the ones with prior art to compare against.
# Metrics restricted to the anchors are comparable across runs; metrics over the
# full draw are NOT -- see the comparability note above.
anchor_targets:
  - 1gpk
  - 1mq6


# Tier-2 (weekly, job cap 360 min, N_WORKERS=4, and it runs EVERY dataset in one
# job). The full 85 targets would need ceil(85/4)*26.9 = 592 min -- over the cap on
# this dataset alone, before the other 13 datasets get any time at all. 12 targets
# is ceil(12/4)*26.9 = 80.7 min, ~22% of the budget, leaving room for the rest.
# Random selection means the full 85 are still covered, in ~7 weekly runs.
tier2_subset_size: 12
tier2_selection: random

structural_states:
  - holo

