# Astex Diverse Set — the 85 complexes of Hartshorn et al. 2007, Table 2
#
# This file exists because the live `astex_diverse` definition is NOT the
# published Astex Diverse Set. Measured against Table 2 of the primary source:
# 72/85 overlap, 13 codes in the live roster are absent from the paper and 13
# codes in the paper are absent from the live roster. Two of the 13 substitutes
# have a buffer or a cryoprotectant as their largest non-polymer component
# (2HR7 -> P33, a PEG oligomer; 1TW6 -> BTB, bis-tris), so they are not
# protein-ligand docking cases at all.
#
# PRIMARY SOURCE, extracted in-session, not recalled:
#   Hartshorn, Verdonk, Chessari, Brewerton, Mooij, Mortenson, Murray (2007)
#   "Diverse, High-Quality Test Set for the Validation of Protein-Ligand
#    Docking Performance", J. Med. Chem. 50(4):726-741
#   DOI 10.1021/jm061277y
#   Table 2, "Protein and Ligand Names for the 85 Complexes in the Set",
#   journal pages 734-735.
#
# HOW THE LIST WAS EXTRACTED (reproducible):
#   The table was parsed from the PDF text layer by CHARACTER POSITION, not by
#   a line regex: characters were clustered into lines by baseline, then binned
#   into the six table columns by their x coordinate, so a wrapped target name
#   attaches to its own row and the target/compound split is read off the
#   layout rather than guessed. A bare PDB-code regex over this paper matches
#   page numbers and potency values such as 1000/2007/5000, so the extraction
#   is line-anchored (^[0-9][a-z][a-z0-9]{2}) and the resulting count is
#   ASSERTED against the table's OWN stated N, parsed from its caption
#   ("for the 85 Complexes in the Set"). 85 extracted == 85 stated.
#   Glyph decoding was verified against 200-dpi renders of the two table pages:
#   the text layer maps beta to 'a-circumflex' and alpha to 'R', and 'R' is
#   ALSO a genuine Latin R in RSR-13, (R)-roscovitine, (R)-mesopram and
#   R-bicalutamide. Substitutions were applied only where the glyph was read
#   visually, never by pattern.
#
# sha256 of the sorted, newline-joined lowercase code list:
#   57a2e7419f6edd0768aad4295d84560d8f48619c237ffa1279aa4bb9887148c0
# sha256 of benchmarks/astex_diverse/astex_diverse_hartshorn85.csv:
#   77d8082311ae8d3917cb48523715d1bb100f0f3d5fff7d842af57366b54a8946
# sha256 of the source PDF the table was read from:
#   662bb63a7ae61bd73c84673dbac5fc87695822a054860ad73e74adad06111753
#
# NOT LIVE. Nothing reads this file yet. See DATASET_REMEDIATION_C2C7.md for the
# exact one-line change per entry point that would make it live.

slug: astex_diverse_hartshorn85
docking_mode: self_docking
name: "Astex Diverse Set (Hartshorn 2007 Table 2, verified)"
benchmark_order: 1
description: >
  The 85 protein-ligand complexes named in Table 2 of Hartshorn et al. 2007.
  Codes extracted from the primary source; resolutions and cognate ligand CCD
  codes verified per target against RCSB. Supersedes the `astex_diverse`
  definition, which differs from the published set on 13 of 85 targets.

primary_source:
  doi: 10.1021/jm061277y
  citation: "Hartshorn et al. (2007) J. Med. Chem. 50(4):726-741"
  table: "Table 2, journal pages 734-735"
  stated_n: 85
  extracted_n: 85
  code_list_sha256: 57a2e7419f6edd0768aad4295d84560d8f48619c237ffa1279aa4bb9887148c0
  roster_csv: benchmarks/astex_diverse/astex_diverse_hartshorn85.csv
  roster_csv_sha256: 77d8082311ae8d3917cb48523715d1bb100f0f3d5fff7d842af57366b54a8946
  source_pdf_sha256: 662bb63a7ae61bd73c84673dbac5fc87695822a054860ad73e74adad06111753
  extracted_utc: "2026-09-11T00:54:51Z"

# Every non-constant column in the roster CSV is per-target data. These two are
# CONSTANT BY DESIGN and are declared here so a constant-column check can tell
# a declared constant from an undeclared placeholder (the defect that produced
# ligand_id="LIG" and resolution_A=2.0 on all 85 rows of the live roster).
constant_columns:
  - column: source_doi
    justification: "every row comes from one table in one paper; the per-row
      locator is source_locator, which is distinct on all 85 rows"
  - column: experimental_method
    justification: "MEASURED, not defaulted: all 85 entries are X-ray structures
      according to RCSB rcsb_entry_info.experimental_method"

verification:
  resolution_source: "RCSB data API rcsb_entry_info.resolution_combined[0], fetched per code"
  resolution_distinct_values: 27
  resolution_range_A: [1.09, 2.5]
  ligand_id_source: "RCSB non-polymer entities, cognate selected per target"
  ligand_id_basis_counts:
    NAME_MATCH_PAPER: 40
    SOLE_NON_ADDITIVE_CANDIDATE: 44
    HEURISTIC_LARGEST: 1
  independent_cross_check:
    against: benchmarks/datasets/astex_apo_strip_report.csv
    note: "ligand_title in that report is derived from the cached SDFs, not from
      the roster's ligand_id column, so it is an independent witness for the 72
      codes the two sets share."
    comparable_rows: 72
    agree: 71
    disagree: 1
    disagreement: "1HQ2 — the repository's cached ligand is APC (an ATP analogue,
      a cofactor), while Table 2 names the compound HP and the corresponding CCD
      component is PH2 (6-hydroxymethyl-7,8-dihydropterin). The repository has
      been docking the cofactor for this target."

zenodo_doi: ""
download_url: "https://www.ccdc.cam.ac.uk/community/freeprod/astex-diverse-set/"
data_format: pdb
tier: 2
structural_states:
  - holo

