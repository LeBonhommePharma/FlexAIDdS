# PoseX CD — Cross-docking benchmark (1312 entries)
# From PoseX paper (2025): recent PDB complexes (2022-2025), cross-docking using apo-like receptors.
# See: https://arxiv.org/abs/2505.01700
# n=1312 cross-dock pairs.
# Used for large-scale benchmarking (tier-2).
# Source catalog: benchmarks/m3pro/large_dataset_entry_catalogs.json
# Dataset definition: benchmarks/datasets/posex_cd_1312.json

slug: posex_cd
name: "PoseX Cross-Docking (1312)"
benchmark_order: 10
description: >
  Cross-docking benchmark from the PoseX suite: 1312 tasks on recent (post-2021)
  protein-ligand complexes. Receptors are non-native (cross) conformations;
  ligands are cognate but docked into different structures of the same target.
  Strict test of generalization and handling of conformational changes.
  Complements Astex for modern AI vs physics benchmarking.
  Includes annotations for pocket similarity (TM-score) to pre-2022 pockets.

zenodo_doi: ""
download_url: "https://github.com/CataAI/PoseX"
data_format: pdb
tier: 2
tier1_subset_size: 5

structural_states:
  - crossdock

# Full list in posex_cd_1312.json (1312 pairs)
# Tier-1 uses first 5 for smoke/CI.
# Full run uses the large catalog for distributed execution.
targets: ["7FVX_K7C", "7EGO_X90", "7HG3_A1A34", "7RGY_5BI", "8PQ9_9KI"]  # tier1 real entries; full uses catalog for tier2. See benchmark_posex_cd_tier1.json for paths.

# Notes for benchmarking:
# - Use oracle binding sites where available (from crystal ligand position in the pair).
# - For fair comparison, use consistent prep (apo extraction, protonation, etc.).
# - Metrics: docking_power (top-1/top-3 RMSD<2.0), success with PoseBusters validation.
# - Typical baseline: physics-based ~50-60%, AI methods vary; high success requires good site definition and flexibility handling.
# - In FlexAIDdS: use --mode autonomous or oracle-ceiling as appropriate; full thermo for ranking.
# - See results/posex_cd_20260616 for example run outputs (partial ~249 entries prepared/run).

